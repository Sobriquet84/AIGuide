 do anything this Guide prohibits</p></div></div>"}, {"id": "agents", "tag": "Section 7", "title": "AI agents, automation and Custom GPTs", "teaser": "What you need before you connect or build anything.", "short": "Agents and GPTs", "body": "<ol class=\"steps\"><li class=\"step\"><span class=\"dot\">1</span><h3>Get approval first</h3><p>Don’t connect an agent or automation to Atlas HXM systems, data, or client data without going through the required approval process first (see “Yellow light” below).</p></li><li class=\"step\"><span class=\"dot\">2</span><h3>Name an accountable human</h3><p>Every agent that takes action (sends messages, changes records, touches money, talks to clients or workers) needs a named human accountable for what it does.</p></li><li class=\"step\"><span class=\"dot\">3</span><h3>Build in controls</h3><p>Before any agent goes live, it needs a kill-switch, logging, defined scope limits, and someone responsible if something goes wrong.</p></li><li class=\"step\"><span class=\"dot\">4</span><h3>Registering a custom GPT</h3><p>Building a custom GPT that others besides you will use? It has to be registered in the Atlas HXM GPT registry with its purpose, data tier, and an owner by submitting a ticket to <a href=\"mailto:help@atlashxm.com\">help@atlashxm.com</a>.</p></li></ol>"}, {"id": "features", "tag": "Section 8", "title": "When a tool adds a new AI feature", "teaser": "What to do when a tool you already use gains AI.", "short": "New AI features", "body": "<p class=\"lede\">Many of the SaaS tools we already use are quietly adding AI features: summarization, transcription, drafting assistants, agents. When that happens:</p><ol class=\"steps\"><li class=\"step\"><span class=\"dot\">1</span><h3>Check the list first</h3><p>Don’t enable it by default — check the <a href=\"https://strategichrandcomp.sharepoint.com/:x:/g/isms/IQCbxECCzlFYS4wSJyMLfP0MAcSd2kVaRr89xOCRNaTwPOo?e=ZHI2Pc\" target=\"_blank\" rel=\"noopener\">Approved AI Tool list</a> first.</p></li><li class=\"step\"><span class=\"dot\">2</span><h3>Stay within the data tier</h3><p>If the tool is already approved, use the new AI feature only within the data classification tier it’s approved for (see “What can I put into an AI tool?” above). Approval for one tier doesn’t carry over to a more sensitive one.</p></li><li class=\"step\"><span class=\"dot\">3</span><h3>Ask IT and Risk & Compliance</h3><p>If the tool is not on the approved list, or you’re not sure whether the new feature is covered, email IT Help on <a href=\"mailto:help@atlashxm.com\">help@atlashxm.com</a> and copy Risk &amp; Compliance on <a href=\"mailto:compliance@atlashxm.com\">compliance@atlashxm.com</a> for review before turning it on.</p></li><li class=\"step\"><span class=\"dot\">4</span><h3>Report vendor AI features</h3><p>Notice a vendor AI feature quietly processing Atlas HXM or client data? Report it. It may affect sub-processor disclosures Atlas HXM owes clients.</p></li></ol>"}, {"id": "ask", "tag": "Section 9", "title": "Not sure? Ask", "teaser": "Who to contact before you proceed.", "short": "Not sure? Ask", "body": "<div class=\"card \"><p class=\"lede\" style=\"color:var(--text)\">If you’re weighing whether something is okay to run through AI, pause and check the AI Policy or reach out to Risk &amp; Compliance (<a href=\"mailto:compliance@atlashxm.com\">compliance@atlashxm.com</a>) or the IT Help Desk (<a href=\"mailto:help@atlashxm.com\">help@atlashxm.com</a>) before you proceed. One email is a lot safer than a mistake and asking is always the right move.</p></div><div class=\"grid2\"><div class=\"card \"><p class=\"k\">Risk & Compliance</p><p>Questions about the AI Policy, new AI features and data risk.</p><p><a class=\"mail\" href=\"mailto:compliance@atlashxm.com\">compliance@atlashxm.com</a></p></div><div class=\"card \"><p class=\"k\">IT Help Desk</p><p>Access to tools, approvals, and security incidents.</p><p><a class=\"mail\" href=\"mailto:help@atlashxm.com\">help@atlashxm.com</a></p></div></div>"}], "DU": [{"t": "Publicly available information", "p": "Yes", "k": "g", "req": "News articles, academic papers, published legislation, public reports, and open datasets."}, {"t": "Non-sensitive personal data / PII", "p": "Yes, with restrictions", "k": "y", "req": "Names, corporate email addresses, addresses, phone numbers, job titles, education, skills, and employment history not classified as Sensitive Data. May be used only in an Approved AI Tool through an Atlas HXM enterprise account. Wherever possible, replace real Personal Data with generic or anonymized information e.g., use initials such as “Employee A”, “Jane Doe” or “BH”, a dummy email address such as “<a href=\"mailto:employee@example.com\">employee@example.com</a>” instead of a real name or email address, or a fictional/random employee or candidate ID instead of an actual identifier."}, {"t": "Generic operational or process information", "p": "Yes", "k": "g", "req": "Permitted where it does not reveal trade secrets, client-confidential information, proprietary methods, or other Restricted information."}, {"t": "Draft documents", "p": "Yes", "k": "g", "req": "Permitted where the document does not contain Sensitive or Restricted Data."}, {"t": "Training and educational materials", "p": "Yes", "k": "g", "req": "Permitted where the materials do not contain Sensitive or Restricted Data."}, {"t": "Translation requests", "p": "Yes", "k": "g", "req": "Low-risk, non-confidential documents may be submitted for translation."}, {"t": "Marketing and external communications", "p": "Yes", "k": "g", "req": "Permitted provided the content does not contain Sensitive, Restricted, or confidential information."}, {"t": "Proprietary information and Intellectual Property", "p": "Restricted", "k": "y", "req": "Source code, product roadmaps, pricing models, and similar information may be used only where specifically permitted, in an Approved AI Tool through an Atlas HXM enterprise account, and in line with Atlas HXM security requirements."}, {"t": "Financial information", "p": "Restricted", "k": "y", "req": "Forecasts, budgets, and unpublished results may be entered only into an Approved AI Tool with model training disabled, CFO approval, and the minimum data necessary."}, {"t": "Sensitive personal data", "p": "No", "k": "r", "req": "Personal Data classified as Sensitive under the Atlas HXM Data Classification Policy must not be entered into AI tools. "}, {"t": "Sensitive employee information", "p": "No", "k": "r", "req": "Compensation, performance reviews, disciplinary records, health information, and similar data held in BambooHR or similar systems. This does not restrict approved AI features built directly into those systems."}, {"t": "Client confidential information", "p": "No", "k": "r", "req": "Client business information, transaction details, customer information, and client databases received under confidentiality obligations."}, {"t": "Highly sensitive financial information", "p": "No", "k": "r", "req": "M&amp;A target information, Board materials, investor-sensitive information, and similar confidential financial data."}, {"t": "Legally privileged or sensitive legal information", "p": "No", "k": "r", "req": "Privileged communications, litigation strategy, confidential regulatory submissions, and settlement terms."}, {"t": "Credentials and access information", "p": "No", "k": "r", "req": "Passwords, API keys, cryptographic keys, authentication tokens, and other security credentials."}, {"t": "Regulated health or medical information", "p": "No", "k": "r", "req": "Information regulated by HIPAA or equivalent laws, including employee, client, or other individual health information."}], "UC": [{"s": "approved", "a": "General / cross-functional", "u": "Drafting non-decision communications (announcements, FAQs, help articles)", "l": "Guardrails", "g": "Confirm that the AI tool is on the <a href=\"https://strategichrandcomp.sharepoint.com/:x:/g/isms/IQCbxECCzlFYS4wSJyMLfP0MAcSd2kVaRr89xOCRNaTwPOo?e=ZHI2Pc\" target=\"_blank\" rel=\"noopener\">Approved AI Tool list</a> and that you are using it through your Atlas corporate email account. Review content for accuracy, tone, and inclusiveness. Be transparent about the use of AI and do not present AI-generated work as entirely your own."}, {"s": "approved", "a": "General / cross-functional", "u": "Summarizing documents you already have permission to read", "l": "Guardrails", "g": "Confirm that the AI tool is on the <a href=\"https://strategichrandcomp.sharepoint.com/:x:/g/isms/IQCbxECCzlFYS4wSJyMLfP0MAcSd2kVaRr89xOCRNaTwPOo?e=ZHI2Pc\" target=\"_blank\" rel=\"noopener\">Approved AI Tool list</a> and that you are using it through your Atlas corporate email account. Check that AI summaries are accurate before using them. Only enter confidential or client information into AI tools specifically approved by Atlas HXM."}, {"s": "approved", "a": "General / cross-functional", "u": "Research and learning support", "l": "Guardrails", "g": "Verify AI-generated information against reliable sources or consult relevant internal experts including Legal and Compliance team before relying on it."}, {"s": "approved", "a": "General / cross-functional", "u": "Brainstorming, idea generation, frameworks", "l": "Guardrails", "g": "Use AI to support your thinking and decision-making, but do not rely on it to make decisions for you. Ensure that decisions are made by you and document your reasons."}, {"s": "approved", "a": "General / cross-functional", "u": "Formatting, proofreading, tone improvement on your own writing", "l": "Guardrails", "g": "Review the final content for accuracy, quality, and appropriateness before using or sharing it. You remain responsible for the final content."}, {"s": "approved", "a": "General / cross-functional", "u": "Drafting internal presentations, meeting notes, status updates", "l": "Guardrails", "g": "Confirm that the AI tool is on the <a href=\"https://strategichrandcomp.sharepoint.com/:x:/g/isms/IQCbxECCzlFYS4wSJyMLfP0MAcSd2kVaRr89xOCRNaTwPOo?e=ZHI2Pc\" target=\"_blank\" rel=\"noopener\">Approved AI Tool list</a> and that you are using it through your Atlas corporate email account. Review the AI-generated summary to ensure it accurately reflects the original information before sharing."}, {"s": "approved", "a": "General / cross-functional", "u": "Translating routine internal drafts that do not involve legal or sensitive matters.", "l": "Guardrails", "g": "Have someone fluent in the language check the AI translation for accuracy before sharing it."}, {"s": "approved", "a": "HR & People Operations", "u": "AI-drafted job descriptions", "l": "Guardrails", "g": "HR must review AI-generated content for potential bias or discrimination. AI must not be used to establish discriminatory hiring criteria, and all hiring practices must comply with applicable equal employment opportunity and anti-discrimination laws."}, {"s": "approved", "a": "HR & People Operations", "u": "AI analysis of engagement survey results", "l": "Guardrails", "g": "Data must be fully anonymized or aggregated so that individuals cannot be identified. If there is any risk of identifying an individual, the use case must be classified as “Conditional” and the required controls and approvals must be followed."}, {"s": "approved", "a": "HR & People Operations", "u": "AI-drafted employee communications (including HR templates)", "l": "Guardrails", "g": "Confirm that the AI tool is on the <a href=\"https://strategichrandcomp.sharepoint.com/:x:/g/isms/IQCbxECCzlFYS4wSJyMLfP0MAcSd2kVaRr89xOCRNaTwPOo?e=ZHI2Pc\" target=\"_blank\" rel=\"noopener\">Approved AI Tool list</a> and that you are using it through your Atlas corporate email account. All AI-generated content must be reviewed by you before use. Legal approval is required for sensitive employment matters, such as redundancy or disciplinary actions."}, {"s": "approved", "a": "Reporting & Analytics", "u": "Exporting HR analytics (headcount, attrition) into AI", "l": "Guardrails", "g": "Confirm that the AI tool is on the <a href=\"https://strategichrandcomp.sharepoint.com/:x:/g/isms/IQCbxECCzlFYS4wSJyMLfP0MAcSd2kVaRr89xOCRNaTwPOo?e=ZHI2Pc\" target=\"_blank\" rel=\"noopener\">Approved AI Tool list</a> and that you are using it through your Atlas corporate email account. Only use data that has been fully anonymized or combined into group-level summaries so that no individual can be identified. Do not include sensitive personal information."}, {"s": "approved", "a": "Reporting & Analytics", "u": "AI-generated competitor intelligence from public data", "l": "Guardrails", "g": "Verify all AI-generated information against reliable, publicly available sources before using or sharing it. AI may generate inaccurate or misleading information, so human review is required before publication."}, {"s": "approved", "a": "Legal", "u": "AI-assisted legal research and drafting", "l": "Guardrails", "g": "Only the Legal team may use AI for legal research. All AI-generated legal information must be verified and reviewed by a qualified legal professional before use. Do not rely on AI as a source of definitive legal advice or enter legally privileged information into AI tools."}, {"s": "approved", "a": "Marketing & Communications", "u": "AI-generated marketing copy (generic)", "l": "Guardrails", "g": "Confirm that the AI tool is on the <a href=\"https://strategichrandcomp.sharepoint.com/:x:/g/isms/IQCbxECCzlFYS4wSJyMLfP0MAcSd2kVaRr89xOCRNaTwPOo?e=ZHI2Pc\" target=\"_blank\" rel=\"noopener\">Approved AI Tool list</a> and that you are using it through your Atlas corporate email account. All AI-generated marketing content must be reviewed by a human before use or publication. Check for potential copyright or intellectual property infringement. If unsure, reach out to <a href=\"mailto:compliance@atlashxm.com\" target=\"_blank\" rel=\"noopener\">compliance@atlashxm.com</a> Verify all facts, statistics, and quotes to ensure they are accurate and not fabricated. Be transparent about the use of AI and do not present AI-generated content as entirely human-created."}, {"s": "approved", "a": "Marketing & Communications", "u": "Using AI to analyze publicly available social media content to understand customer opinions, brand reputation, and sentiment.", "l": "Guardrails", "g": "Only use publicly available information. Do not collect or upload personal information without an appropriate legal basis under applicable data protection laws, including GDPR. All AI-generated findings must be reviewed and verified by a human before use or publication. Do not (re) publish comments that could identify individuals without their consent or another valid legal basis."}, {"s": "approved", "a": "Agentic AI", "u": "Classifying, routing, and drafting initial responses to routine internal helpdesk or IT support tickets", "l": "Guardrails", "g": "Any customer-facing, non-routine, escalated, or sensitive communication must be reviewed by a human before it’s sent."}, {"s": "approved", "a": "Agentic AI", "u": "Automated calendar coordination, meeting scheduling, and travel logistics on an Employee’s behalf for low-risk administrative tasks", "l": "Guardrails", "g": "Employees must review and confirm all bookings before they are finalized. Any purchase or financial commitment requires explicit human approval."}, {"s": "approved", "a": "Agentic AI", "u": "Collecting and summarizing publicly available market intelligence, regulatory updates, or competitive insights", "l": "Guardrails", "g": "Treat AI-generated findings as drafts. Verify information against reliable sources before using or sharing it."}, {"s": "approved", "a": "Agentic AI", "u": "Drafting standard, low-risk contract clauses from an approved clause library", "l": "Guardrails", "g": "Legal must review and approve AI-generated contract clauses before use. AI must not independently create new clauses, approve, or sign contracts."}, {"s": "approved", "a": "Agentic AI", "u": "Drafting job descriptions, scheduling interviews, and sending standard candidate communications using approved templates", "l": "Guardrails", "g": "HR approval is required. AI must not independently score, rank, or reject candidates. Hiring decisions must be made by authorized employees, not AI. "}, {"s": "conditional", "a": "CRM & Customer Data", "u": "AI-generated customer responses drawn from CRM history", "l": "Required controls & approvals", "g": "Confirm that the AI tool is on the <a href=\"https://strategichrandcomp.sharepoint.com/:x:/g/isms/IQCbxECCzlFYS4wSJyMLfP0MAcSd2kVaRr89xOCRNaTwPOo?e=ZHI2Pc\" target=\"_blank\" rel=\"noopener\">Approved AI Tool list</a> and that you are using it through your Atlas corporate email account. You must review the responses for accuracy, relevance, confidentiality and appropriate wording before sending the response. "}, {"s": "conditional", "a": "CRM & Customer Data", "u": "Summarizing Zendesk/HubSpot tickets into a report", "l": "Required controls & approvals", "g": "Confirm that the AI tool is on the <a href=\"https://strategichrandcomp.sharepoint.com/:x:/g/isms/IQCbxECCzlFYS4wSJyMLfP0MAcSd2kVaRr89xOCRNaTwPOo?e=ZHI2Pc\" target=\"_blank\" rel=\"noopener\">Approved AI Tool list</a> and that you are using it through your Atlas corporate email account. Remove or minimize personally identifiable information (PII) as defined in the <a href=\"https://atlashxm.workvivo.com/spaces/59834/pages\" target=\"_blank\" rel=\"noopener\">Data Classification Policy</a>. You must not include passwords, authentication credentials, and API keys in the AI prompt. You must review the report against the underlying records to identify inaccuracies or missing information before relying on it."}, {"s": "conditional", "a": "CRM & Customer Data", "u": "Pasting HubSpot deal data into AI for pipeline insights/forecasts", "l": "Required controls & approvals", "g": "Confirm that the AI tool is on the <a href=\"https://strategichrandcomp.sharepoint.com/:x:/g/isms/IQCbxECCzlFYS4wSJyMLfP0MAcSd2kVaRr89xOCRNaTwPOo?e=ZHI2Pc\" target=\"_blank\" rel=\"noopener\">Approved AI Tool list</a> and that you are using it through your Atlas corporate email account. Define the business purpose of the analysis and what information is required. Obtain CTO and/or CISO approval via <a href=\"mailto:help@atlashxm.com\" target=\"_blank\" rel=\"noopener\">help@atlashxm.com</a> before proceeding. Minimize personal information and exclude passwords, authentication credentials, and API keys from AI prompts. Ensure that the use of personal information is consistent with the <a href=\"https://atlashxm.workvivo.com/spaces/59834/pages\" target=\"_blank\" rel=\"noopener\">Data Classification Policy</a> and where required complete the Privacy by Design initiation form. A human must review the AI-generated analysis and verify the forecasts before using them for business planning or decision-making."}, {"s": "conditional", "a": "CRM & Customer Data", "u": "Using AI to auto-classify/label Zendesk tickets", "l": "Required controls & approvals", "g": "Confirm that the AI tool is on the <a href=\"https://strategichrandcomp.sharepoint.com/:x:/g/isms/IQCbxECCzlFYS4wSJyMLfP0MAcSd2kVaRr89xOCRNaTwPOo?e=ZHI2Pc\" target=\"_blank\" rel=\"noopener\">Approved AI Tool list</a> and that you are using it through your Atlas corporate email account. Define the business purpose of the analysis and what information is required. Obtain CTO and/or CISO approval via <a href=\"mailto:help@atlashxm.com\" target=\"_blank\" rel=\"noopener\">help@atlashxm.com</a> before proceeding. Minimize personal information and exclude passwords, authentication credentials, and API keys from AI prompts. Ensure that the use of personal information is consistent with the <a href=\"https://atlashxm.workvivo.com/spaces/59834/pages\" target=\"_blank\" rel=\"noopener\">Data Classification Policy</a> and where required complete the Privacy by Design initiation form. A human must review the AI-generated analysis and verify the forecasts before using them for business planning or decision-making."}, {"s": "conditional", "a": "CRM & Customer Data", "u": "Exporting a HubSpot contact list to build AI-generated segments/content", "l": "Required controls & approvals", "g": "Confirm that the AI tool is on the <a href=\"https://strategichrandcomp.sharepoint.com/:x:/g/isms/IQCbxECCzlFYS4wSJyMLfP0MAcSd2kVaRr89xOCRNaTwPOo?e=ZHI2Pc\" target=\"_blank\" rel=\"noopener\">Approved AI Tool list</a> and that you are using it through your Atlas corporate email account. Define the business purpose of the analysis and what information is required. Obtain CTO and/or CISO approval via <a href=\"mailto:help@atlashxm.com\" target=\"_blank\" rel=\"noopener\">help@atlashxm.com</a> before proceeding. Minimize personal information and exclude passwords, authentication credentials, and API keys from AI prompts. Ensure that the use of personal information is consistent with the <a href=\"https://atlashxm.workvivo.com/spaces/59834/pages\" target=\"_blank\" rel=\"noopener\">Data Classification Policy</a> and where required complete the Privacy by Design initiation form. A human must review the AI-generated analysis and verify the forecasts before using them for business planning or decision-making."}, {"s": "conditional", "a": "APIs & System Integrations", "u": "AI-powered API between Zendesk and internal systems", "l": "Required controls & approvals", "g": "Submit an approval request to the CTO and/or CISO via a helpdesk ticket at <a href=\"mailto:help@atlashxm.com\" target=\"_blank\" rel=\"noopener\">help@atlashxm.com</a>. Never enter credentials or API keys into AI prompts."}, {"s": "conditional", "a": "APIs & System Integrations", "u": "API between HubSpot and an AI reporting dashboard", "l": "Required controls & approvals", "g": "Submit an approval request to the CTO and/or CISO via a helpdesk ticket at <a href=\"mailto:help@atlashxm.com\" target=\"_blank\" rel=\"noopener\">help@atlashxm.com</a>. Never enter credentials into AI prompts. Use only aggregated data without PII. Audit logging is required. A Data Processing Impact Assessment (DPIA) is required if personal data is involved. Human approval is required before AI can make changes to CRM data."}, {"s": "conditional", "a": "APIs & System Integrations", "u": "Connecting an AI tool to Atlas HXM SharePoint", "l": "Required controls & approvals", "g": "Submit a request to <a href=\"mailto:help@atlashxm.com\" target=\"_blank\" rel=\"noopener\">help@atlashxm.com</a> for CTO and CISO approval. Only company-approved AI accounts may be used. Sensitive or Restricted data is prohibited. Users may only access data they already have permission to view."}, {"s": "conditional", "a": "APIs & System Integrations", "u": "Automated workflow (Zapier, Make, n8n) with an AI step touching CRM or HR data", "l": "Required controls & approvals", "g": "Submit a request to <a href=\"mailto:help@atlashxm.com\" target=\"_blank\" rel=\"noopener\">help@atlashxm.com</a> for CTO and CISO approval. P&amp;T team will follow up with questions about data classification, audit logging, and security requirements. PII and Sensitive data are not permitted in standard automated workflows. Never enter passwords, authentication credentials, and API keys into AI prompts. Human approval is required before AI makes changes to systems or data."}, {"s": "conditional", "a": "IT and Engineering", "u": "AI coding assistants with autonomous capabilities (opening PRs, modifying repos, running commands, deploying code)", "l": "Conditions", "g": "Submit a request to <a href=\"mailto:help@atlashxm.com\" target=\"_blank\" rel=\"noopener\">help@atlashxm.com</a> for CTO and CISO approval. P&amp;T team will follow up with questions about access permissions, logging, monitoring, and human oversight requirements."}, {"s": "conditional", "a": "Reporting & Analytics", "u": "Uploading financial reports/spreadsheets/internal financial documents", "l": "Required controls & approvals", "g": "Confirm that the AI tool is on the <a href=\"https://strategichrandcomp.sharepoint.com/:x:/g/isms/IQCbxECCzlFYS4wSJyMLfP0MAcSd2kVaRr89xOCRNaTwPOo?e=ZHI2Pc\" target=\"_blank\" rel=\"noopener\">Approved AI Tool list</a> and that you are using it through your Atlas corporate email account. Identify the financial documents and information involved and ensure the use of information (data) is consistent with the <a href=\"https://atlashxm.workvivo.com/spaces/59834/pages\" target=\"_blank\" rel=\"noopener\">Data Classification Policy</a>. Share only the information necessary for the task. Submit a request to <a href=\"mailto:help@atlashxm.com\" target=\"_blank\" rel=\"noopener\">help@atlashxm.com</a> to obtain CISO and CFO approval before uploading the documents. All AI-generated calculations, summaries, and financial conclusions must be reviewed by you before relying on them."}, {"s": "conditional", "a": "Reporting & Analytics", "u": "Using AI to query Atlas HXM’s internal data warehouse", "l": "Required controls & approvals", "g": "Obtain CTO and CISO approval via <a href=\"mailto:help@atlashxm.com\" target=\"_blank\" rel=\"noopener\">help@atlashxm.com</a> ticket to ensure that you have the required permission to access the data in the internal data warehouse. Confirm that the AI tool is on the <a href=\"https://strategichrandcomp.sharepoint.com/:x:/g/isms/IQCbxECCzlFYS4wSJyMLfP0MAcSd2kVaRr89xOCRNaTwPOo?e=ZHI2Pc\" target=\"_blank\" rel=\"noopener\">Approved AI Tool list</a> and that you are using it through your Atlas corporate email account. Exclude Sensitive and Restricted information when querying the data warehouse. Results must be validated by you before using them in reports or business decisions."}, {"s": "conditional", "a": "Reporting & Analytics", "u": "AI analysis of sales-call transcripts", "l": "Required controls & approvals", "g": "Confirm that the AI tool is on the <a href=\"https://strategichrandcomp.sharepoint.com/:x:/g/isms/IQCbxECCzlFYS4wSJyMLfP0MAcSd2kVaRr89xOCRNaTwPOo?e=ZHI2Pc\" target=\"_blank\" rel=\"noopener\">Approved AI Tool list</a> and that you are using it through your Atlas corporate email account. Treat the transcript and its outputs as confidential information. Inform all attendees that an AI transcription or note-taking tool will be used. Obtain consent from all attendees before activating the AI tool. Do not allow an AI note-taker to join meetings automatically without confirming that its use is approved, appropriate and authorized. Always be aware and turn off AI note-takers when confidential, sensitive or restricted discussions arise. Review the AI-generated analysis before use. Store and handle transcripts as confidential information. "}, {"s": "conditional", "a": "Reporting & Analytics", "u": "AI transcription of internal meetings", "l": "Required controls & approvals", "g": "Confirm that the AI tool is on the <a href=\"https://strategichrandcomp.sharepoint.com/:x:/g/isms/IQCbxECCzlFYS4wSJyMLfP0MAcSd2kVaRr89xOCRNaTwPOo?e=ZHI2Pc\" target=\"_blank\" rel=\"noopener\">Approved AI Tool list</a> and that you are using it through your Atlas corporate email account. Inform all attendees that an AI transcription or note-taking tool will be used. Obtain consent from all attendees before activating the AI tool. Do not allow an AI note-taker to join meetings automatically without confirming that its use is appropriate and authorized. At the start of the meeting, confirm that the meeting will not involve confidential, sensitive or restricted information that cannot be processed by the tool. For board, M&amp;A, legal, or investor meetings, obtain CLCO approval before using AI transcription. Always be aware and turn off AI note-takers when confidential, sensitive or restricted discussions arise. Store and handle transcripts as Confidential information. "}, {"s": "conditional", "a": "Reporting & Analytics", "u": "AI transcription of client/external meetings", "l": "Required controls & approvals", "g": "Where NDA exists, check whether the relevant client agreement or NDA restricts AI recording or transcription. Confirm that the AI tool is on the <a href=\"https://strategichrandcomp.sharepoint.com/:x:/g/isms/IQCbxECCzlFYS4wSJyMLfP0MAcSd2kVaRr89xOCRNaTwPOo?e=ZHI2Pc\" target=\"_blank\" rel=\"noopener\">Approved AI Tool list</a> and that you are using it through your Atlas corporate email account. Inform the client that an AI transcription or note-taking tool will be used. Obtain explicit consent from all attendees before activating the AI tool. Do not allow an AI note-taker to join meetings automatically without confirming that its use is appropriate and authorized. At the start of the meeting, confirm that the meeting will not involve confidential, sensitive or restricted information that cannot be processed by the tool. Always be aware and turn off AI note-takers when confidential, sensitive or restricted discussions arise. Store and handle transcripts as Confidential information. "}, {"s": "conditional", "a": "Reporting & Analytics", "u": "Pasting email threads into AI to draft responses", "l": "Required controls & approvals", "g": "Confirm that the AI tool is on the <a href=\"https://strategichrandcomp.sharepoint.com/:x:/g/isms/IQCbxECCzlFYS4wSJyMLfP0MAcSd2kVaRr89xOCRNaTwPOo?e=ZHI2Pc\" target=\"_blank\" rel=\"noopener\">Approved AI Tool list</a> and that you are using it through your Atlas corporate email account. Review the email thread and remove Sensitive PII and confidential information before entering it into AI. Check the draft for accuracy, confidentiality, tone, and appropriate commitments. Review the final response before sending. Do not send AI-generated emails without a human reviewing it."}, {"s": "conditional", "a": "Reporting & Analytics", "u": "Uploading contracts for AI to extract clauses / review", "l": "Required controls & approvals", "g": "Check whether the relevant agreement or NDA permits AI processing of the document. Confirm that the AI tool is on the <a href=\"https://strategichrandcomp.sharepoint.com/:x:/g/isms/IQCbxECCzlFYS4wSJyMLfP0MAcSd2kVaRr89xOCRNaTwPOo?e=ZHI2Pc\" target=\"_blank\" rel=\"noopener\">Approved AI Tool list</a> and that you are using it through your Atlas corporate email account. Use AI to identify or summarize contractual provisions. Send the output to Legal for review and validation. Obtain Legal team’s approval before using new or revised contractual clauses. Do not allow AI or AI agents to independently approve, sign, or execute agreements."}, {"s": "conditional", "a": "HR & People Operations", "u": "AI summarization of candidate interview notes", "l": "Required controls & approvals", "g": "Confirm that the AI tool is on the <a href=\"https://strategichrandcomp.sharepoint.com/:x:/g/isms/IQCbxECCzlFYS4wSJyMLfP0MAcSd2kVaRr89xOCRNaTwPOo?e=ZHI2Pc\" target=\"_blank\" rel=\"noopener\">Approved AI Tool list</a> and that you are using it through your Atlas corporate email account. Review the summary to ensure it accurately reflects the interview. Store the approved interview notes only in Greenhouse, the designated applicant tracking system. AI-generated hiring assessments and recommendations must be independently reviewed by the hiring manager or authorized HR representative, who must retain the authority to question, override, or disregard the AI’s output. AI must not independently make final hiring or rejection decisions without meaningful human involvement."}, {"s": "conditional", "a": "HR & People Operations", "u": "AI analysis of interview transcripts", "l": "Required controls & approvals", "g": "Confirm that the AI tool is on the <a href=\"https://strategichrandcomp.sharepoint.com/:x:/g/isms/IQCbxECCzlFYS4wSJyMLfP0MAcSd2kVaRr89xOCRNaTwPOo?e=ZHI2Pc\" target=\"_blank\" rel=\"noopener\">Approved AI Tool list</a> and that you are using it through your Atlas corporate email account. Inform all attendees that an AI recording or note-taking tool will be used. Obtain consent from all attendees before activating an AI recording or note-taking tool. AI note-takers must not automatically join meetings unless all participants have consented and the tool’s use has been confirmed as appropriate and authorized. Always be aware and turn off AI note-takers when confidential, sensitive or restricted discussions arise."}, {"s": "conditional", "a": "Finance", "u": "AI for invoice processing / accounts-payable automation", "l": "Required controls & approvals", "g": "Confirm that the AI tool is on the <a href=\"https://strategichrandcomp.sharepoint.com/:x:/g/isms/IQCbxECCzlFYS4wSJyMLfP0MAcSd2kVaRr89xOCRNaTwPOo?e=ZHI2Pc\" target=\"_blank\" rel=\"noopener\">Approved AI Tool list</a> and that you are using it through your Atlas corporate email account. Maintain an audit trail of all AI activity. Require an authorized employee to review for accuracy and approval before execution."}, {"s": "conditional", "a": "Marketing & Communications", "u": "AI personalization of marketing emails using CRM data", "l": "Required controls & approvals", "g": "Confirm that the AI tool is on the <a href=\"https://strategichrandcomp.sharepoint.com/:x:/g/isms/IQCbxECCzlFYS4wSJyMLfP0MAcSd2kVaRr89xOCRNaTwPOo?e=ZHI2Pc\" target=\"_blank\" rel=\"noopener\">Approved AI Tool list</a> and that you are using it through your Atlas corporate email account. Confirm that the contacts have given the required consent and agreed to receive marketing communications or that there is another valid legal reason to contact them for marketing purposes. Do not upload Sensitive PII into AI tools. Where uncertain, submit the proposed content and data use to R&amp;C (<a href=\"mailto:compliance@atlashxm.com\">compliance@atlashxm.com</a>) for review. Obtain human review and approval before sending the communications."}, {"s": "conditional", "a": "Marketing & Communications", "u": "AI image generation for marketing materials", "l": "Required controls & approvals", "g": "Confirm that the AI tool is on the <a href=\"https://strategichrandcomp.sharepoint.com/:x:/g/isms/IQCbxECCzlFYS4wSJyMLfP0MAcSd2kVaRr89xOCRNaTwPOo?e=ZHI2Pc\" target=\"_blank\" rel=\"noopener\">Approved AI Tool list</a> and that you are using it through your Atlas corporate email account. Confirm that the intended image does not violate intellectual property or copyright requirements. If unsure, reach out to the Legal team on the proposed use. Obtain consent before generating or using images of identifiable real people. Review the image for misleading, inappropriate, or infringing content. Use only the approved image in external marketing materials."}, {"s": "prohibited", "a": "General / cross-functional", "u": "Entering candidate, worker, employee, or client-confidential data into any AI tool not on the Approved list — including personal accounts", "l": "Why", "g": "Loss of confidentiality; breach of privacy law and client contracts; undisclosed vendors who would have access to personal and confidential data."}, {"s": "prohibited", "a": "General / cross-functional", "u": "AI emotion, sentiment, mood, voice-tone, or facial-expression analysis of candidates, workers, or employees", "l": "Why", "g": "Prohibited under the EU AI Act and treated as high-risk elsewhere. Also, unreliable and biased."}, {"s": "prohibited", "a": "General / cross-functional", "u": "Inferring protected characteristics (race, ethnicity, religion, disability, age, sex, orientation, union membership, immigration status, health) from data", "l": "Why", "g": "Discrimination risk under the EU AI Act, GDPR, EEOC, and equivalent laws."}, {"s": "prohibited", "a": "General / cross-functional", "u": "Using AI as the sole decision maker on anything affecting someone’s employment, benefits, classification, compensation, or opportunity", "l": "Why", "g": "Breaches GDPR and the human-oversight requirement in the EU AI Act."}, {"s": "prohibited", "a": "General / cross-functional", "u": "Generating deepfakes or synthetic media impersonating a real person without consent", "l": "Why", "g": "Identity harm, fraud risk, potential criminal exposure."}, {"s": "prohibited", "a": "General / cross-functional", "u": "Using AI to draft binding contracts, formal legal advice, or regulatory submissions without Legal review", "l": "Why", "g": "High hallucination risk in legal drafting; liability may seat with Atlas HXM."}, {"s": "prohibited", "a": "General / cross-functional", "u": "Pasting Atlas HXM data into a personal AI tool “just to check,” then using the result at Atlas HXM", "l": "Why", "g": "Same policy applies to output as input; undermines our data-handling terms."}, {"s": "prohibited", "a": "General / cross-functional", "u": "Passing AI-produced content off as your own unaided work when attribution matters (published thought leadership, formal submissions)", "l": "Why", "g": "Misrepresentation; may breach client contracts and the Code of Conduct."}, {"s": "prohibited", "a": "APIs & System Integrations", "u": "Using AI to circumvent, bypass, or test Atlas HXM’s security controls, access management, or monitoring without explicit CISO authorization", "l": "Guardrails", "g": "Strictly prohibited."}, {"s": "prohibited", "a": "Reporting & Analytics", "u": "Exporting sensitive and confidential HR data including individual performance and using AI to analyze it for insights, patterns, or actions", "l": "Guardrails", "g": "Strictly prohibited."}, {"s": "prohibited", "a": "HR & People Operations", "u": "Solely using AI for scoring or ranking of job candidates", "l": "Guardrails", "g": "Strictly prohibited."}, {"s": "prohibited", "a": "HR & People Operations", "u": "AI for employee performance analysis", "l": "Guardrails", "g": "Strictly prohibited. "}, {"s": "prohibited", "a": "HR & People Operations", "u": "AI inferring emotions or intentions of candidates/employees using biometric data (facial expression, etc.)", "l": "Guardrails", "g": "Strictly prohibited."}, {"s": "prohibited", "a": "Marketing & Communications", "u": "AI-generated deepfake videos or synthetic media", "l": "Guardrails", "g": "Strictly prohibited. No synthetic media impersonating real people; no AI audio/video of real people without consent. Violates the Code of Conduct."}, {"s": "prohibited", "a": "Agentic AI", "u": "Autonomous decision-making or communication on hiring, promotion, performance evaluation, discipline, or termination", "l": "Guardrails", "g": "Strictly prohibited."}, {"s": "prohibited", "a": "Agentic AI", "u": "Executing financial transactions, approving expenditures, or committing Atlas HXM to obligations above a de minimis threshold (as defined by Finance) without human involvement", "l": "Guardrails", "g": "Strictly prohibited."}, {"s": "prohibited", "a": "Agentic AI", "u": "Unsupervised external communications to clients, regulators, or third parties", "l": "Guardrails", "g": "Strictly prohibited, except low-risk automated notifications explicitly authorized by the CLCO. All other external communications need prior human review and approval."}, {"s": "prohibited", "a": "Agentic AI", "u": "Filing, submitting, or signing legal or regulatory documents on Atlas HXM’s behalf", "l": "Guardrails", "g": "Strictly prohibited."}, {"s": "prohibited", "a": "Agentic AI", "u": "Accessing Sensitive Data or Restricted Data", "l": "Guardrails", "g": "Strictly prohibited without a completed Privacy Impact Assessment and explicit approval from the CISO and CLCO."}, {"s": "prohibited", "a": "Agentic AI", "u": "Persistent or broad access to production systems, databases, or cloud infrastructure", "l": "Guardrails", "g": "Strictly prohibited. Any access must be narrowly scoped to a specific task and time-limited where possible."}, {"s": "prohibited", "a": "Agentic AI", "u": "Monitoring, analyzing, or evaluating employees using biometric data (facial recognition, voice analysis, movement tracking)", "l": "Guardrails", "g": "Strictly prohibited."}, {"s": "prohibited", "a": "Agentic AI", "u": "Impersonating individuals, generating deepfakes, or otherwise deceiving or manipulating the recipients of AI-generated communications", "l": "Guardrails", "g": "Strictly prohibited."}, {"s": "prohibited", "a": "Agentic AI", "u": "Configuring or prompting AI to bypass, disable, or circumvent Atlas HXM’s security controls, monitoring systems, or access management", "l": "Guardrails", "g": "Strictly prohibited."}, {"s": "prohibited", "a": "Agentic AI", "u": "Deploying Agentic AI in customer-facing roles", "l": "Guardrails", "g": "Strictly prohibited without a separate, formal approval process involving the CLCO, CISO, and relevant business leadership."}], "AREAS": ["General / cross-functional", "APIs & System Integrations", "Agentic AI", "CRM & Customer Data", "Finance", "HR & People Operations", "IT and Engineering", "Legal", "Marketing & Communications", "Reporting & Analytics"], "notes": {"sub": "Examples of approved, conditional, and prohibited uses, by function", "traffic": "Atlas HXM uses a simple traffic-light system. Role-specific guidance may add restrictions on top of this — it never adds permission.", "conditional": "Conditional uses need the right approved tool for the data tier, the listed controls, and the listed sign-offs — before you start.", "prohibited": "Prohibited uses are off the table regardless of business need. If a project or vendor points you toward one of these, stop and escalate to Risk &amp; Compliance. <em>See AI Policy Section 7.2 for the full, authoritative list of prohibited Agentic AI uses.</em>"}, "status": [["Green (Approved)", "Proceed, following the stated conditions."], ["Yellow (Conditional)", "Get the required approvals and controls in place first — don’t start on your own."], ["Red (Prohibited) or not listed", "Don’t proceed. Escalate to Risk &amp; Compliance if you think an exception is warranted."]], "basics": null, "home": {"intro": "Six things to know before you use AI at work. The detail is in the policy and the guide.", "basics": "<div class=\"card\"><p class=\"k\">AI Guide</p><h3>You’re accountable</h3><p>AI may help you draft, but ultimately, you decide. Always review and verify before you send, publish, or act on anything AI produces.</p></div><div class=\"card\"><p class=\"k\">AI Guide</p><h3>Keep it separate</h3><p>Don’t use your Atlas HXM AI account for personal tasks and don’t use personal accounts for Atlas HXM work.</p></div><div class=\"card\"><p class=\"k\">AI Guide</p><h3>Mind what you share</h3><p>Sensitive data (employee records, health info, pay, client-confidential info) never goes into an AI tool.</p></div><div class=\"card\"><p class=\"k\">AI Policy</p><h3>Keep people decisions human</h3><p>Employees must not use AI to make or implement autonomous decisions about individuals without appropriate human oversight.</p></div><div class=\"card\"><p class=\"k\">AI Guide</p><h3>Be honest about AI’s role</h3><p>If AI meaningfully shaped a decision or piece of work, be ready to say so if asked, and if AI substantially produced a decision, memo, or communication, note that in the file record at the time. It protects you and Atlas HXM if the decision is ever questioned later.</p></div><div class=\"card\"><p class=\"k\">AI Guide</p><h3>Report problems</h3><p>Report any suspected AI-related security incident or unauthorized AI use to both Risk &amp; Compliance (<a href=\"mailto:compliance@atlashxm.com\">compliance@atlashxm.com</a>) and the CISO (<a href=\"mailto:help@atlashxm.com\">help@atlashxm.com</a>) as soon as practicable.</p></div>", "who": "<div class=\"card \"><p class=\"k\">Who this is for</p><p>This guide applies to all Atlas HXM employees, contractors, and consultants across all countries where Atlas HXM operates. It should be read together with the AI Policy, Code of Conduct, Information Security Policy, Data Classification Policy, Data Protection Policy, and Acceptable Use Policy.</p></div><div class=\"card \"><p class=\"k\">What counts as “AI”</p><p>Any tool that uses machine learning or generative AI to create content, summaries, recommendations, or decisions e.g. standalone tools (ChatGPT, Claude, Copilot) and AI features built into everyday tools (BambooHR, Greenhouse, HubSpot, Zendesk, Teams, and similar).</p></div>", "lights": "<div class=\"card s-g\"><div><span class=\"chip g\"><i></i>Go ahead</span></div><h3>Green light — go ahead</h3><ul class=\"checks lightlist g\"><li>Drafting announcements, FAQs, or other non-decision communications</li><li>Summarizing public or internal documents you already have access to</li><li>Research, learning, and brainstorming (just verify anything before you rely on it)</li><li>Proofreading, formatting, and improving tone on content you wrote</li></ul></div><div class=\"card s-y\"><div><span class=\"chip y\"><i></i>Ask first</span></div><h3>Yellow light — ask first/get sign-off</h3><ul class=\"checks lightlist y\"><li>AI-drafted job descriptions or employee communications (HR review required)</li><li>Connecting AI to a system like SharePoint, HubSpot, or Zendesk (needs approval: send an email to <a href=\"mailto:help@atlashxm.com\" target=\"_blank\" rel=\"noopener\">help@atlashxm.com</a>)</li><li>Uploading financial reports, contracts, or call/meeting transcripts (corporate or enterprise account + human review required)</li><li>Any new AI tool, agent, or integration you want to bring into Atlas HXM must follow the TPRA process.</li></ul></div><div class=\"card s-r\"><div><span class=\"chip r\"><i></i>Never</span></div><h3>Red light — never</h3><ul class=\"checks lightlist r\"><li>Entering employee, candidate, or client-confidential data into any non-approved AI tool, including personal accounts</li><li>Using AI to analyze emotion, tone, or facial expressions of candidates or employees</li><li>Letting AI infer protected characteristics (race, disability, age, religion, and similar) from data</li><li>Letting AI be the sole decision-maker on anything affecting someone’s employment, pay, or opportunities</li></ul></div>", "ask": "If you’re weighing whether something is okay to run through AI, pause and check the AI Policy or reach out to Risk &amp; Compliance (<a href=\"mailto:compliance@atlashxm.com\">compliance@atlashxm.com</a>) or the IT Help Desk (<a href=\"mailto:help@atlashxm.com\">help@atlashxm.com</a>) before you proceed. One email is a lot safer than a mistake and asking is always the right move.", "approved": "https://strategichrandcomp.sharepoint.com/:x:/g/isms/IQCbxECCzlFYS4wSJyMLfP0MAcSd2kVaRr89xOCRNaTwPOo?e=ZHI2Pc", "versions": "AI Policy: Version 2.00 | Date: 26 October, 2026. AI Guide: Version 1.00 | Date: 26 October, 2026. Atlas HXM - Confidential."}};

const ARROW='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const PLUS='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
const TICK='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>';
const CHIPS={g:'<span class="chip g"><i></i>__L__</span>',y:'<span class="chip y"><i></i>__L__</span>',r:'<span class="chip r"><i></i>__L__</span>'};
const chip=(k,l)=>CHIPS[k].replace('__L__',l);
let uid=1000;const seen=new Set();
const rv=(title,body,chipHtml)=>{const id='rx'+(++uid);return `<div class="rv"><button class="rv-btn" type="button" aria-expanded="false" aria-controls="${id}"><span class="lead"><span>${title}</span></span><span class="meta">${chipHtml||''}<span class="ic">${PLUS}</span></span></button><div class="rv-p" id="${id}"><div class="rv-in"><div class="rv-body">${body}</div></div></div></div>`};
const STAT={approved:['g','Approved'],conditional:['y','Conditional'],prohibited:['r','Prohibited']};
const strip=h=>h.replace(/<[^>]+>/g,'');
S.UC.forEach(u=>{u.q=(u.u+' '+u.a+' '+strip(u.g)).toLowerCase()});

/* appendix: data table */
const st={du:'all',ucs:'all',uca:'all',ucq:''};
function duItems(){return S.DU.filter(d=>st.du==='all'||d.p===st.du)}
function duList(){const items=duItems();return items.map(d=>rv(d.t,`<p class="lab">Requirements / Examples</p><p>${d.req}</p>`,chip(d.k,d.p))).join('')}
function duBody(){
  const opts=[['all','All'],['Yes','Yes'],['Yes, with restrictions','Yes, with restrictions'],['Restricted','Restricted'],['No','No']];
  const chips=opts.map(([v,l])=>{const n=v==='all'?S.DU.length:S.DU.filter(d=>d.p===v).length;return `<button class="fchip" type="button" data-duf="${v}" aria-pressed="${st.du===v}">${l} (${n})</button>`}).join('');
  return `<div class="fbar"><div class="filters" role="group" aria-label="Filter by permission">${chips}</div><p class="count" id="du-count" aria-live="polite">Showing ${duItems().length} of ${S.DU.length}</p></div>
  <div class="rv-set"><div class="rv-top"><button class="link-btn" type="button" data-all="open">Show all</button></div><div class="rv-grid one" id="du-list">${duList()}</div></div>`;
}
/* appendix: use cases */
function ucItems(){const q=st.ucq.trim().toLowerCase();return S.UC.filter(u=>(st.ucs==='all'||u.s===st.ucs)&&(st.uca==='all'||u.a===st.uca)&&(!q||u.q.includes(q)))}
function ucNote(){const n=S.notes[st.ucs];return n?`<div class="banner"><strong>${STAT[st.ucs][1]}</strong><span>${n}</span></div>`:''}
function ucList(){const items=ucItems();if(!items.length)return '<div class="empty">No use cases match. Try a different filter or search term.</div>';
  return items.map(u=>rv(`${u.u}<span class="sub">${u.a}</span>`,`<p class="lab">${u.l}</p><p>${u.g}</p>`,chip(STAT[u.s][0],STAT[u.s][1]))).join('')}
function ucBody(){
  const statusCards=S.status.map((r,i)=>`<div class="card s-${'gyr'[i]}"><div>${chip('gyr'[i],r[0].split(' (')[0])}</div><h3>${r[0]}</h3><p>${r[1]}</p></div>`).join('');
  const sopts=[['all','All']].concat(Object.entries(STAT).map(([k,v])=>[k,v[1]]));
  const chips=sopts.map(([v,l])=>{const n=v==='all'?S.UC.length:S.UC.filter(u=>u.s===v).length;return `<button class="fchip" type="button" data-ucs="${v}" aria-pressed="${st.ucs===v}">${l} (${n})</button>`}).join('');
  const areas=['<option value="all">All functions</option>'].concat(S.AREAS.map(a=>`<option value="${a.replace(/"/g,'&quot;')}" ${st.uca===a?'selected':''}>${a}</option>`)).join('');
  return `<p class="lede" style="margin-bottom:-4px">${S.notes.traffic}</p><div class="statuses">${statusCards}</div>
  <div class="fbar"><div class="filters" role="group" aria-label="Filter by status">${chips}</div>
  <div class="frow"><label class="field">Function<select id="uc-area">${areas}</select></label><label class="field">Search<input id="uc-q" type="search" placeholder="For example: transcription" value="${st.ucq.replace(/"/g,'&quot;')}"></label></div>
  <p class="count" id="uc-count" aria-live="polite">Showing ${ucItems().length} of ${S.UC.length}</p></div>
  <div id="uc-note">${ucNote()}</div>
  <div class="rv-set"><div class="rv-top"><button class="link-btn" type="button" data-all="open">Show all</button></div><div class="rv-grid one" id="uc-list">${ucList()}</div></div>`;
}

  topics:S.policy.map(t=>Object.assign({},t,{body:()=>t.body}))},
 guide:{nav:'AI Guide',short:'AI Guide',cls:'ch-guide',tag:'Part two / AI Guide',title:['AI Guide.','What to do day to day.'],
  lede:'<em>The practical do’s and don’ts for using AI at work.</em> Read it together with the AI Policy.',ver:'Version 1.00 | Date: 26 October, 2026',img:IMG.WOMAN,alt:'A person with headphones working at a laptop',
  topics:S.guide.map(t=>Object.assign({},t,{body:()=>t.body}))},
 appendix:{nav:'Appendix',short:'Appendix',cls:'ch-appendix',tag:'Part three / Appendix',title:['Appendix.','Check a use before you start.'],
  lede:'Look up <em>what data can go into an AI tool, and which uses are approved, conditional or prohibited.</em>',ver:'',img:IMG.BUBBLE,alt:'A purple speech bubble with a pink question mark',
  topics:[
   {id:'data',tag:'Appendix A / AI Policy',title:'Data use in AI tools',teaser:`${S.DU.length} types of data, and whether each can go into an AI tool.`,short:'Data use',body:duBody},
   {id:'usecases',tag:'Appendix A / AI Guide',title:'Examples of approved, conditional and prohibited uses',teaser:`${S.UC.length} use cases by function, with the guardrails for each.`,short:'Use cases by function',body:ucBody}]}
};
const ORDER=['policy','guide','appendix'];

/* views */
const hero=c=>`<section class="chap"><div class="wrap"><div><p class="tag">${c.tag}</p><h1 tabindex="-1">${c.title[0]}<br>${c.title[1]}</h1><p class="lede">${c.lede}</p>${c.ver?`<p class="ver">${c.ver}</p>`:''}</div><figure class="chap-art"><img src="${c.img}" alt="${c.alt}"></figure></div></section>`;
function homeView(){
  const doors=ORDER.map(k=>{const c=CH[k];const n=c.topics.length;const sub={policy:'The rules and obligations that apply to everyone at Atlas HXM.',guide:'Everyday do’s and don’ts for using AI at work.',appendix:'A data table and use cases by function.'}[k];
    return `<a class="path ${c.cls}" href="#${k}"><span class="num">${'0'+(ORDER.indexOf(k)+1)}</span><h3>${c.nav}</h3><p>${sub}</p><span class="small">${k==='appendix'?n+' lookup tools':n+' topics'}</span><span class="go">Open ${ARROW}</span></a>`}).join('');
  return `<div class="enter ch-home">
  <section class="hero"><div class="wrap"><div>
    <p class="tag">For people, by people</p>
    <h1 tabindex="-1">AI at Atlas HXM.</h1>
    <span class="pill">Your quick guide</span>
    <p class="tagline">The practical do’s and don’ts for using AI at work.</p>
    <p class="lede">Start with the basics on this page. Open the policy, the guide or the appendix when you need the detail.</p></div>
    <div class="hero-art"><img src="${IMG.COVER}" alt="AI Governance, Policy and Guidelines: a glowing shield with a checked document"></div></div></section>
  <section class="sec"><div class="wrap">
    <div class="sec-head"><h2>Where do you want to go?</h2><p class="lede">Pick the document you need. Each one opens into short topics you can read in any order.</p></div>
    <div class="paths">${doors}</div></div></section>
  <section class="sec" style="padding-top:0"><div class="wrap">
    <div class="sec-head"><h2>The basics</h2><p class="lede">${S.home.intro}</p></div>
    <div class="grid3">${S.home.basics}</div>
    <div class="grid2" style="margin-top:16px">${S.home.who}</div>
    <div style="margin-top:18px"><a class="btn" href="${S.home.approved}" target="_blank" rel="noopener">Open the Approved AI Tool list</a></div></div></section>
  <section class="sec" style="padding-top:0"><div class="wrap">
    <div class="sec-head"><h2>Green, yellow, red</h2><p class="lede">A quick check before you start. The guide has the full list.</p></div>
    <div class="quick3">${S.home.lights}</div>
    <div style="margin-top:18px"><a class="btn ghost" href="#guide-lights">See the full list ${ARROW}</a></div></div></section>
  <section class="sec" style="padding-top:0"><div class="wrap"><div class="strip"><div><p class="small" style="color:#C9BBE8">Not sure? Ask</p><h3>One email is safer than a mistake.</h3><p>${S.home.ask}</p></div>
    <div class="contact-row"><a class="btn light" href="mailto:compliance@atlashxm.com">Risk &amp; Compliance</a><a class="btn light" href="mailto:help@atlashxm.com">IT Help Desk</a></div></div>
    <p class="small" style="margin-top:16px">${S.home.versions}</p></div></section></div>`;
}
function chapterView(k){
  const c=CH[k];
  const tiles=c.topics.map(t=>`<a class="tile" href="#${k}-${t.id}"><span class="k">${t.tag}</span><h3>${t.title}</h3><p>${t.teaser}</p><span class="foot"><span class="go">Open ${ARROW}</span>${seen.has(k+t.id)?`<span class="seen">${TICK} Viewed</span>`:''}</span></a>`).join('');
  return `<div class="enter ${c.cls}">${hero(c)}<section class="sec"><div class="wrap"><div class="sec-head"><h2>Pick a topic</h2><p class="lede">Open only what you need.</p></div><div class="tiles">${tiles}</div></div></section></div>`;
}
function topicView(k,t){
  const c=CH[k];seen.add(k+t.id);
  const idx=c.topics.indexOf(t);const prev=idx>0?c.topics[idx-1]:null,next=idx<c.topics.length-1?c.topics[idx+1]:null;
  const nextCh=ORDER[ORDER.indexOf(k)+1];
  const sw=c.topics.map(x=>`<a href="#${k}-${x.id}" ${x===t?'aria-current="page"':''}>${x.short}</a>`).join('');
  const prevBtn=prev?`<a class="btn ghost" href="#${k}-${prev.id}">Previous: ${prev.short}</a>`:`<a class="btn ghost" href="#${k}">All topics</a>`;
  const nextBtn=next?`<a class="btn" href="#${k}-${next.id}">Next: ${next.short} ${ARROW}</a>`:(nextCh?`<a class="btn" href="#${nextCh}">Continue to the ${CH[nextCh].nav} ${ARROW}</a>`:`<a class="btn" href="#home">Back to home ${ARROW}</a>`);
  return `<div class="enter ${c.cls}"><div class="wrap">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="#home">Home</a><span aria-hidden="true">/</span><a href="#${k}">${c.nav}</a></nav>
    <div class="switch" aria-label="Topics in this section">${sw}</div>
    <header class="topic-head"><p class="tag">${t.tag}</p><h1 tabindex="-1">${t.title}</h1><p class="lede">${t.teaser}</p></header>
    <div class="topic-body">${t.body()}</div>
    <div class="pager">${prevBtn}${nextBtn}</div></div></div>`;
}

/* routing */
const app=document.getElementById('app');let first=true;
function route(){
  const raw=decodeURIComponent(location.hash.slice(1));const i=raw.indexOf('-');const c=i<0?raw:raw.slice(0,i);const t=i<0?'':raw.slice(i+1);
  let h,active='home';
  if(CH[c]){const tp=CH[c].topics.find(x=>x.id===t);h=tp?topicView(c,tp):chapterView(c);active=c}else h=homeView();
  app.innerHTML=h;
  document.querySelectorAll('[data-nav]').forEach(a=>{a.dataset.nav===active?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});
  document.title=active==='home'?'AI at Atlas HXM | Your quick guide':'AI at Atlas HXM | '+CH[active].short;
  window.scrollTo(0,0);
  if(!first){const x=app.querySelector('h1');if(x)x.focus({preventScroll:true})}
  first=false;
}
window.addEventListener('hashchange',route);

/* interactions */
function refreshDu(){document.getElementById('du-list').innerHTML=duList();document.getElementById('du-count').textContent=`Showing ${duItems().length} of ${S.DU.length}`;
  document.querySelectorAll('[data-duf]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.duf===st.du))}
function refreshUc(){document.getElementById('uc-list').innerHTML=ucList();document.getElementById('uc-note').innerHTML=ucNote();document.getElementById('uc-count').textContent=`Showing ${ucItems().length} of ${S.UC.length}`;
  document.querySelectorAll('[data-ucs]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.ucs===st.ucs))}
app.addEventListener('click',e=>{
  const b=e.target.closest('.rv-btn');
  if(b){const r=b.closest('.rv');const o=r.classList.toggle('open');b.setAttribute('aria-expanded',o);return}
  const all=e.target.closest('[data-all]');
  if(all){const set=all.closest('.rv-set');const open=all.dataset.all==='open';
    set.querySelectorAll('.rv').forEach(r=>{r.classList.toggle('open',open);r.querySelector('.rv-btn').setAttribute('aria-expanded',open)});
    all.dataset.all=open?'close':'open';all.textContent=open?'Hide all':'Show all';return}
  const df=e.target.closest('[data-duf]');if(df){st.du=df.dataset.duf;refreshDu();return}
  const us=e.target.closest('[data-ucs]');if(us){st.ucs=us.dataset.ucs;refreshUc();return}
  const lt=e.target.closest('[data-light]');
  if(lt){const k=lt.dataset.light;document.querySelectorAll('[data-light]').forEach(x=>x.setAttribute('aria-pressed',x===lt));document.querySelectorAll('[data-lp]').forEach(p=>{p.hidden=p.dataset.lp!==k})}
});
app.addEventListener('change',e=>{if(e.target.id==='uc-area'){st.uca=e.target.value;refreshUc()}});
app.addEventListener('input',e=>{if(e.target.id==='uc-q'){st.ucq=e.target.value;refreshUc()}});
route();
</script>
</body>
</html>
