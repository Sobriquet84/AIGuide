<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI at Atlas HXM | Your quick guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8F7FC;--surface:#FFFFFF;--tint:#F2EDFF;--tint2:#E6DCFC;
  --text:#220C3D;--text2:#49385C;--muted:#6B617A;--line:#E5DEF0;
  --purple:#5A22E8;--purple-t:#5A22E8;
  --blue:#196DFA;--blue-t:#196DFA;
  --magenta:#B63BC8;--magenta-t:#A12FB4;
  --pink:#FF7AA4;--cyan:#1FCDE0;--ink:#220C3D;
  --hero-a:#EFE7FF;--hero-b:#DCE8FF;
  --focus:#196DFA;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14091F;--surface:#1E1030;--tint:#2A1846;--tint2:#36215A;
    --text:#F2EDFF;--text2:#D3C9E8;--muted:#A99DC2;--line:#3A2757;
    --purple-t:#B9A0FF;--blue-t:#7FAEFF;--magenta-t:#E08BF0;
    --ink:#2A1846;--hero-a:#241341;--hero-b:#14243F;--focus:#7FAEFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14091F;--surface:#1E1030;--tint:#2A1846;--tint2:#36215A;
  --text:#F2EDFF;--text2:#D3C9E8;--muted:#A99DC2;--line:#3A2757;
  --purple-t:#B9A0FF;--blue-t:#7FAEFF;--magenta-t:#E08BF0;
  --ink:#2A1846;--hero-a:#241341;--hero-b:#14243F;--focus:#7FAEFF;
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-optical-sizing:auto;font-size:1.0625rem;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3,p,ol,ul,figure{margin:0}
ul,ol{padding:0;list-style:none}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:3px}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:24px;min-height:64px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{display:flex;align-items:center;flex:none;text-decoration:none}
.brand img{height:30px;width:auto}
.logo-l{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-d{display:none}:root:not([data-theme="light"]) .logo-l{display:block}}
:root[data-theme="dark"] .logo-d{display:none}
:root[data-theme="dark"] .logo-l{display:block}
.nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.nav a{white-space:nowrap;text-decoration:none;font-size:.9375rem;font-weight:550;color:var(--text2);padding:8px 12px;border-bottom:3px solid transparent}
.nav a:hover{color:var(--text)}
.nav a[aria-current="page"]{color:var(--text);border-bottom-color:var(--purple)}
@media (max-width:760px){.top .wrap{gap:4px}.nav{margin-left:0;width:100%}}

/* type */
.tag{font-size:.9rem;font-weight:600;color:var(--purple-t)}
h1{font-weight:800;letter-spacing:-.03em;line-height:1.05}
h2{font-size:clamp(1.65rem,3.2vw,2.3rem);font-weight:700;letter-spacing:-.02em;line-height:1.15}
h3{font-size:1.15rem;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.lede{color:var(--text2);font-size:1.125rem;max-width:58ch}
.small{font-size:.9rem;color:var(--muted)}

/* chapter accents */
.ch-safe{--ac:var(--blue);--ac-t:var(--blue-t)}
.ch-prompting{--ac:var(--purple);--ac-t:var(--purple-t)}
.ch-automation{--ac:var(--magenta);--ac-t:var(--magenta-t)}
.ch-cheatsheet{--ac:var(--purple);--ac-t:var(--purple-t)}

/* view enter */
.enter{animation:enter .2s ease-out}
@keyframes enter{from{opacity:0}to{opacity:1}}

/* home hero */
.hero{background:linear-gradient(115deg,var(--hero-a),var(--hero-b));}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(24px,5vw,64px);align-items:center;padding-top:clamp(32px,6vw,72px);padding-bottom:clamp(32px,6vw,72px)}
.hero h1{font-size:clamp(3rem,8vw,5.6rem);margin:12px 0 18px}
.pill{display:inline-block;background:var(--purple);color:#fff;font-weight:700;border-radius:999px;padding:8px 22px;font-size:1.1rem}
.hero .tagline{font-size:clamp(1.5rem,3vw,2.1rem);font-weight:700;letter-spacing:-.02em;line-height:1.2;margin:26px 0 14px}
.hero-art{position:relative;justify-self:end;width:100%;max-width:440px}
.hero-art::before{content:"";position:absolute;width:34%;aspect-ratio:1;border-radius:50%;background:var(--pink);right:-6%;bottom:-7%;z-index:0}
.hero-art img{position:relative;z-index:1;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:28px;box-shadow:0 24px 48px -24px rgba(34,12,61,.45)}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr}.hero-art{max-width:340px;justify-self:start}}

/* sections */
.sec{padding:clamp(36px,6vw,72px) 0}
.sec-head{display:grid;gap:10px;margin-bottom:28px}
.paths{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:860px){.paths{grid-template-columns:1fr}}
.path{display:flex;flex-direction:column;gap:10px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--ac);border-radius:6px;padding:22px 22px 20px;min-height:230px;transition:transform .15s ease,box-shadow .15s ease}
.path:hover{transform:translateY(-3px);box-shadow:0 14px 28px -16px rgba(34,12,61,.35)}
.path .num{font-size:2.6rem;font-weight:800;letter-spacing:-.04em;color:var(--ac-t);line-height:1}
.path p{color:var(--text2)}
.go{margin-top:auto;display:inline-flex;align-items:center;gap:8px;font-weight:650;color:var(--ac-t);font-size:.95rem}
.go svg{transition:transform .15s ease}
.path:hover .go svg,.tile:hover .go svg{transform:translateX(4px)}
.strip{margin-top:18px;background:var(--ink);color:#fff;border-radius:6px;padding:26px clamp(20px,3vw,32px);display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.strip p{color:#D9CFEF;max-width:52ch}
.strip h3{font-size:1.4rem;margin:2px 0 6px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--purple);color:#fff;text-decoration:none;border:0;border-radius:999px;padding:12px 22px;font-weight:650}
.btn:hover{filter:brightness(1.1)}
.btn.light{background:#fff;color:var(--ink)}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--purple-t);filter:none}

/* chapter hero */
.chap{background:var(--purple);color:#fff}
.chap .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(24px,5vw,56px);align-items:center;padding-top:clamp(28px,5vw,60px);padding-bottom:clamp(28px,5vw,60px)}
.chap .tag{color:#1FCDE0}
.chap .big{font-size:clamp(3.4rem,9vw,6rem);font-weight:800;letter-spacing:-.05em;line-height:1;margin:14px 0 6px}
.chap h1{font-size:clamp(2.1rem,5vw,3.6rem)}
.chap .lede{color:#E9E1FF;margin-top:16px}
.chap .lede em{font-style:normal;font-weight:650;color:#1FCDE0}
.chap-art{position:relative;max-width:420px;width:100%;justify-self:end}
.chap-art::before{content:"";position:absolute;width:36%;aspect-ratio:1;border-radius:50%;background:var(--pink);left:-8%;bottom:-8%}
.chap-art img{position:relative;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:28px;border:8px solid #fff}
@media (max-width:820px){.chap .wrap{grid-template-columns:1fr}.chap-art{justify-self:start;max-width:340px}}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.tile{display:flex;flex-direction:column;gap:8px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--ac);border-radius:6px;padding:18px 20px;min-height:170px;transition:transform .15s ease,box-shadow .15s ease}
.tile:hover{transform:translateY(-2px);box-shadow:0 12px 24px -16px rgba(34,12,61,.35)}
.tile .k{font-size:.85rem;font-weight:600;color:var(--ac-t)}
.tile h3{font-size:1.1rem}
.tile p{font-size:.95rem;color:var(--text2)}
.tile .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.seen{display:inline-flex;align-items:center;gap:5px;font-size:.82rem;font-weight:600;color:var(--muted)}

/* topic view */
.crumbs{padding:22px 0 6px;font-size:.92rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.crumbs a{color:var(--text2);font-weight:600}
.switch{display:flex;gap:8px;overflow-x:auto;padding:8px 0 4px}
.switch a{white-space:nowrap;text-decoration:none;font-size:.88rem;font-weight:600;color:var(--text2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px}
.switch a:hover{border-color:var(--ac)}
.switch a[aria-current="page"]{background:var(--ac);border-color:var(--ac);color:#fff}
.topic-head{padding:26px 0 8px;display:grid;gap:10px;border-bottom:1px solid var(--line);margin-bottom:28px;padding-bottom:26px}
.topic-head .tag{color:var(--ac-t)}
.topic-head h1{font-size:clamp(2rem,4.6vw,3.2rem);max-width:20ch}
.topic-body{display:grid;gap:22px;padding-bottom:12px}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:28px 0 56px}

/* shared blocks */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid4{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr}}
@media (max-width:640px){.grid2,.grid4{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--ac);border-radius:6px;padding:20px 22px;display:grid;gap:8px}
.card p{color:var(--text2)}
.card .k{font-size:.85rem;font-weight:600;color:var(--ac-t)}
.card.solid{background:var(--purple);border-color:var(--purple);color:#fff}
.card.solid p,.card.solid .k{color:#E9E1FF}
.card.alt{--ac:var(--blue)}
.lab{font-size:.85rem;font-weight:650;color:var(--ac-t)}
.banner{background:var(--purple);color:#fff;border-radius:6px;padding:16px 22px;display:flex;gap:10px 18px;flex-wrap:wrap;align-items:baseline}
.banner strong{font-size:.9rem;font-weight:700;color:#D9CCFF}
.banner span{font-weight:550}
.banner a{color:#fff;font-weight:700;text-underline-offset:3px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;counter-reset:s}
.step{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px 20px 22px;display:grid;gap:8px;align-content:start}
.step p{color:var(--text2);font-size:.98rem}
.dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;background:var(--blue)}
.steps .step:nth-child(6n+2) .dot{background:var(--purple)}
.steps .step:nth-child(6n+3) .dot{background:var(--magenta)}
.steps .step:nth-child(6n+4) .dot{background:var(--ink)}
.steps .step:nth-child(6n+5) .dot{background:var(--blue)}
.steps .step:nth-child(6n+6) .dot{background:var(--purple)}
.step b{font-weight:700;color:var(--text)}

/* reveal */
.rv-top{display:flex;justify-content:flex-end}
.link-btn{background:none;border:0;font-weight:650;font-size:.92rem;color:var(--ac-t);padding:6px 2px;text-decoration:underline;text-underline-offset:3px}
.rv-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.rv-grid.one{grid-template-columns:1fr}
.rv-grid.three{grid-template-columns:repeat(3,1fr)}
@media (max-width:900px){.rv-grid.three{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.rv-grid,.rv-grid.three{grid-template-columns:1fr}}
.rv{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--ac);border-radius:6px}
.rv-btn{width:100%;display:flex;gap:14px;align-items:center;justify-content:space-between;text-align:left;background:none;border:0;padding:16px 18px;font-weight:650;line-height:1.35}
.rv-btn .lead{display:flex;gap:12px;align-items:center}
.rv-btn .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:.9rem;font-weight:700}
.rv-btn .ic{flex:none;width:26px;height:26px;border-radius:50%;background:var(--tint);color:var(--ac-t);display:grid;place-items:center;transition:transform .2s ease}
.rv.open .rv-btn .ic{transform:rotate(45deg)}
.rv-p{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease}
.rv.open .rv-p{grid-template-rows:1fr}
.rv-in{overflow:hidden;visibility:hidden;transition:visibility 0s .22s}
.rv.open .rv-in{visibility:visible;transition:visibility 0s 0s}
.rv-body{padding:0 18px 18px;display:grid;gap:12px;color:var(--text2)}
.rv-body .ans{color:var(--text);font-weight:500}

/* copy block */
.copy{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;background:var(--tint);border-left:4px solid var(--ac);border-radius:4px;padding:14px 16px}
.ptext{font-weight:500;color:var(--text);flex:1}
.copy-btn{flex:none;display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:.85rem;font-weight:650;color:var(--text)}
.copy-btn:hover{border-color:var(--ac)}
@media (max-width:520px){.copy{flex-direction:column}}

/* tcrei */
.tc{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:640px}
.tc button{background:none;border:0;display:grid;gap:8px;justify-items:center;padding:6px 2px;font-weight:650;font-size:.8rem;color:var(--text2)}
.tc .ltr{width:clamp(52px,9vw,72px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(1.4rem,3vw,1.9rem);font-weight:700;color:#fff;background:var(--blue);outline:0 solid transparent;outline-offset:0;transition:outline-width .12s ease}
.tc button:nth-child(2) .ltr{background:var(--purple)}
.tc button:nth-child(3) .ltr{background:var(--magenta)}
.tc button:nth-child(4) .ltr{background:var(--blue)}
.tc button:nth-child(5) .ltr{background:var(--purple)}
.tc button[aria-pressed="true"]{color:var(--text)}
.tc button[aria-pressed="true"] .ltr{outline:4px solid var(--pink)}
.tc-panel{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--purple);border-radius:6px;padding:22px 24px;display:grid;gap:6px}
.tc-panel .w{font-size:1.6rem;font-weight:800;letter-spacing:-.02em}

/* vague vs clear */
.vc{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:stretch}
.vc[data-open="false"]{grid-template-columns:1fr}
.vc[data-open="false"] .vc-arrow,.vc[data-open="false"] .vc-clear{display:none}
.vc-arrow{display:grid;place-items:center;background:var(--purple);color:#fff;border-radius:6px;padding:0 12px}
.vc .card{height:100%}
.vc .quote{font-size:1.25rem;font-weight:650;color:var(--text);line-height:1.35}
.vc-vague{--ac:var(--pink)}
.vc-vague .k{color:var(--muted)}
@media (max-width:760px){.vc,.vc[data-open="false"]{grid-template-columns:1fr}.vc-arrow{padding:8px;transform:rotate(90deg)}}

/* lists */
.checks li,.plain li{position:relative;padding-left:26px;color:var(--text2);margin:6px 0}
.checks li::before{content:"";position:absolute;left:2px;top:.45em;width:12px;height:7px;border-left:3px solid var(--ac);border-bottom:3px solid var(--ac);transform:rotate(-45deg)}
.plain li::before{content:"";position:absolute;left:6px;top:.72em;width:7px;height:7px;border-radius:50%;background:var(--ac)}
.quote{font-weight:500;color:var(--text)}

/* footer */
.foot-bar{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:.9rem}
.foot-bar .wrap{display:flex;gap:16px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.foot-bar img{height:22px;width:auto}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}

h1:focus{outline:none}

:root{--g:#1F9D6B;--y:#E0A100;--r:#D6383E;--g-bg:#DDF5EA;--g-fg:#0B6B45;--y-bg:#FFF0C7;--y-fg:#7A5200;--r-bg:#FFE0E2;--r-fg:#A3171C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:#3CC08C;--y:#F2B93B;--r:#F26A70;--g-bg:#123828;--g-fg:#86E3B8;--y-bg:#3F3110;--y-fg:#F6CF6C;--r-bg:#4A1A1E;--r-fg:#FFA3A8}}
:root[data-theme="dark"]{--g:#3CC08C;--y:#F2B93B;--r:#F26A70;--g-bg:#123828;--g-fg:#86E3B8;--y-bg:#3F3110;--y-fg:#F6CF6C;--r-bg:#4A1A1E;--r-fg:#FFA3A8}
.ch-home,.ch-policy{--ac:var(--purple);--ac-t:var(--purple-t)}
.ch-guide{--ac:var(--blue);--ac-t:var(--blue-t)}
.ch-appendix{--ac:var(--magenta);--ac-t:var(--magenta-t)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:.78rem;font-weight:700;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.chip.y i{border-radius:2px;transform:rotate(45deg)}
.chip.r i{border-radius:0;clip-path:polygon(0 0,100% 0,50% 100%)}
.chip.g{background:var(--g-bg);color:var(--g-fg)}.chip.y{background:var(--y-bg);color:var(--y-fg)}.chip.r{background:var(--r-bg);color:var(--r-fg)}
.rv-btn .meta{display:flex;align-items:center;gap:10px;flex:none}
.rv .sub{display:block;font-size:.82rem;font-weight:500;color:var(--muted);margin-top:1px}
.rv-body ul{margin:0}.rv-body h3{font-size:1rem;margin-top:4px}
.rv-body .lab{margin-bottom:-4px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.95rem}
th{text-align:left;background:var(--tint);padding:10px 14px;font-weight:700}
td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top;color:var(--text2)}
.nogos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nogo{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--r);border-radius:6px;padding:14px 16px;color:var(--text2)}
.nogo .x{flex:none;width:26px;height:26px;border-radius:50%;background:var(--r-bg);color:var(--r-fg);display:grid;place-items:center}
@media (max-width:760px){.nogos{grid-template-columns:1fr}}
.tier.tg{border-top-color:var(--g)}.tier.ty{border-top-color:var(--y)}.tier.tr{border-top-color:var(--r)}
.tier .ans{color:var(--text);font-weight:600}.tier h3{font-size:1.15rem}
.lts{display:flex;gap:10px;flex-wrap:wrap}
.lt{display:inline-flex;gap:10px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:10px 18px;font-weight:650;text-align:left}
.lt .dotc{flex:none;width:14px;height:14px;border-radius:50%;background:var(--g)}.lt.y .dotc{background:var(--y);border-radius:3px;transform:rotate(45deg)}.lt.r .dotc{background:var(--r);border-radius:0;clip-path:polygon(0 0,100% 0,50% 100%)}
.lt[aria-pressed="true"]{border-color:var(--text);background:var(--tint)}
.lcard{--ac:var(--text)}
.lightlist li{padding-left:30px;margin:12px 0;color:var(--text)}
.lightlist.g li::before{border-color:var(--g)}
.lightlist.y li::before{border:0;transform:none;width:9px;height:9px;border-radius:2px;background:var(--y);left:4px;top:.55em;transform:rotate(45deg)}
.lightlist.r li::before{content:"\00d7";border:0;transform:none;width:auto;height:auto;left:3px;top:-.05em;font-weight:800;color:var(--r);font-size:1.3rem;line-height:1.5}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fchip{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.9rem}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.fbar{display:grid;gap:14px}
.frow{display:flex;gap:16px;flex-wrap:wrap;align-items:end}
.field{display:grid;gap:4px;font-size:.85rem;font-weight:600;color:var(--text2)}
select,input[type=search]{font:inherit;font-weight:500;padding:9px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text);min-width:220px}
.count{color:var(--muted);font-size:.92rem}
.empty{padding:28px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:6px}
.mail{color:var(--ac-t);font-weight:650;overflow-wrap:anywhere}
.statuses{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:860px){.statuses{grid-template-columns:1fr}}
.statuses .card.s-g{border-top-color:var(--g)}.statuses .card.s-y{border-top-color:var(--y)}.statuses .card.s-r{border-top-color:var(--r)}
.quick3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
@media (max-width:900px){.quick3{grid-template-columns:1fr}}
.quick3 .card.s-g{border-top-color:var(--g)}.quick3 .card.s-y{border-top-color:var(--y)}.quick3 .card.s-r{border-top-color:var(--r)}
.quick3 ul{margin:0}
.chap .ver{margin-top:18px;font-size:.9rem;color:#D9CCFF}
.chap h1{max-width:16ch}
.contact-row{display:flex;gap:12px;flex-wrap:wrap}
.hero .tagline{max-width:22ch}
.conf{font-size:.85rem}
.topic-body{grid-template-columns:minmax(0,1fr)}
.rv-grid.one{grid-template-columns:minmax(0,1fr)}
.rv-set,.table-wrap,.fbar{min-width:0}
.rv-btn .lead{min-width:0;flex:1}
.rv-btn .lead>span{min-width:0;overflow-wrap:anywhere}
@media (max-width:560px){.rv-btn{flex-wrap:wrap}.rv-btn .lead{flex:1 1 100%}.rv-btn .meta{flex:1 1 100%;justify-content:space-between}.rv:not(:has(.chip)) .rv-btn .meta{flex:none;margin-left:auto}}
.card a,.rv-body a,.lede a,.lightlist a,td a,.nogo a,.banner a{overflow-wrap:anywhere}
.card a:not(.btn){color:var(--ac-t);text-underline-offset:3px}
.card.solid a:not(.btn){color:#fff}
.rv-body a{color:var(--ac-t);text-underline-offset:3px}
td a{color:var(--purple-t)}
</style>
</head>

<script>
const S={"policy": [{"id": "scope", "tag": "Section 1", "title": "Policy statement, purpose and scope", "teaser": "Why Atlas HXM has an AI policy and who it covers.", "short": "Purpose and scope", "body": "<div class=\"card \"><p class=\"k\">Policy statement</p><p>Atlas Technology Solutions, Inc. and its subsidiaries (“Atlas HXM,” “the Company,” or “we”) support the responsible use of Artificial Intelligence (AI). AI can provide real benefits, but it can also create legal, ethical, privacy, security, and other risks.</p><p>Atlas HXM is committed to using AI responsibly, ethically, lawfully, and securely, in line with applicable laws and regulations. This Policy explains how AI may be used at Atlas HXM, including approved and prohibited uses, data handling requirements, individual responsibilities, and compliance obligations.</p><p>This Policy is intended to: (i) help Employees use AI effectively while managing risk; (ii) govern the use of AI, including where it may and may not be used; (iii) support compliance with applicable law and good practice; and (iv) set clear accountability and escalation paths so that humans remain in control of AI-driven decisions and actions.</p><p>This Policy should be read together with Atlas HXM’s Data Classification Policy, Information Security Policy, Acceptable Use Policy, Data Protection Policy, and Code of Conduct.</p></div><div><p class=\"lab\" style=\"margin-bottom:10px\">This Policy applies to:</p><div class=\"grid2\"><div class=\"card \"><p>Employees’ use of AI in performing their roles and responsibilities;</p></div><div class=\"card \"><p>Contractors, consultants, and temporary workers with access to Atlas HXM systems or data;</p></div><div class=\"card \"><p>All AI tools, platforms, and AI-enabled products used at Atlas HXM, including <a href=\"https://strategichrandcomp.sharepoint.com/:x:/g/isms/IQCbxECCzlFYS4wSJyMLfP0MAcSd2kVaRr89xOCRNaTwPOo?e=ZHI2Pc\" target=\"_blank\" rel=\"noopener\">Approved AI Tool List</a> and AI features embedded in existing systems (for example, Claude, ChatGPT, Greenhouse, BambooHR, and HubSpot); and</p></div><div class=\"card \"><p>Agentic AI systems that Atlas HXM deploys to carry out tasks on its behalf.</p></div></div></div>"}, {"id": "definitions", "tag": "Section 2", "title": "Definitions", "teaser": "14 terms used across the policy, from Agentic AI to Third Party.", "short": "Definitions", "body": "<p class=\"lede\" style=\"margin-bottom:-6px\">Tap a term to read its definition.</p><div class=\"rv-set\"><div class=\"rv-top\"><button class=\"link-btn\" type=\"button\" data-all=\"open\">Show all</button></div><div class=\"rv-grid \"><div class=\"rv\"><button class=\"rv-btn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"rv1\"><span class=\"lead\"><span>Agentic AI</span></span><span class=\"meta\"><span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></span></span></button><div class=\"rv-p\" id=\"rv1\"><div class=\"rv-in\"><div class=\"rv-body\"><p>An AI system configured to operate with a degree of autonomy carrying out multi-step tasks, making decisions, invoking tools or external systems, and taking actions with little or no human involvement at each step.</p></div></div></div></div><div class=\"rv\"><button class=\"rv-btn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"rv2\"><span class=\"lead\"><span>AI Incident</span></span><span class=\"meta\"><span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></span></span></button><div class=\"rv-p\" id=\"rv2\"><div class=\"rv-in\"><div class=\"rv-body\"><p>Any event where AI use causes, or could reasonably cause, a data breach, security issue, serious error, significant legal, financial, reputational, or other harm to Atlas HXM, a third party, or an individual.</p></div></div></div></div><div class=\"rv\"><button class=\"rv-btn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"rv3\"><span class=\"lead\"><span>Approved AI Tool</span></span><span class=\"meta\"><span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></span></span></button><div class=\"rv-p\" id=\"rv3\"><div class=\"rv-in\"><div class=\"rv-body\"><p>An AI tool that is managed at the enterprise level and/or has been formally approved by Atlas HXM for use by Employees and is listed on the <a href=\"https://strategichrandcomp.sharepoint.com/:x:/g/isms/IQCbxECCzlFYS4wSJyMLfP0MAcSd2kVaRr89xOCRNaTwPOo?e=ZHI2Pc\" target=\"_blank\" rel=\"noopener\">Approved AI Tool List</a>.</p></div></div></div></div><div class=\"rv\"><button class=\"rv-btn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"rv4\"><span class=\"lead\"><span>Artificial Intelligence (AI)</span></span><span class=\"meta\"><span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></span></span></button><div class=\"rv-p\" id=\"rv4\"><div class=\"rv-in\"><div class=\"rv-body\"><p>As defined in the EU AI Act, a machine-based system designed to operate with varying levels of autonomy, that may adapt after deployment, and that infers from input how to generate outputs such as predictions, content, recommendations, or decisions that can influence physical or virtual environments.</p></div></div></div></div><div class=\"rv\"><button class=\"rv-btn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"rv5\"><span class=\"lead\"><span>Employee</span></span><span class=\"meta\"><span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></span></span></button><div class=\"rv-p\" id=\"rv5\"><div class=\"rv-in\"><div class=\"rv-body\"><p>Any person with an employment relationship with Atlas HXM as defined by local law, excluding Worksite Employees.</p></div></div></div></div><div class=\"rv\"><button class=\"rv-btn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"rv6\"><span class=\"lead\"><span>EU AI Act</span></span><span class=\"meta\"><span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></span></span></button><div class=\"rv-p\" id=\"rv6\"><div class=\"rv-in\"><div class=\"rv-body\"><p>Regulation (EU) 2024/1689, which sets harmonized, risk-based requirements for AI systems and general-purpose AI models within the European Union.</p></div></div></div></div><div class=\"rv\"><button class=\"rv-btn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"rv7\"><span class=\"lead\"><span>Generative Artificial Intelligence (Gen AI)</span></span><span class=\"meta\"><span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></span></span></button><div class=\"rv-p\" id=\"rv7\"><div class=\"rv-in\"><div class=\"rv-body\"><p>AI that creates new content such as text, images, video, or other data, based on a user’s input or prompt.</p></div></div></div></div><div class=\"rv\"><button class=\"rv-btn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"rv8\"><span class=\"lead\"><span>Hallucination</span></span><span class=\"meta\"><span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></span></span></button><div class=\"rv-p\" id=\"rv8\"><div class=\"rv-in\"><div class=\"rv-body\"><p>Factually incorrect, fabricated, or misleading information generated by an AI tool or system and presented as if it were accurate.</p></div></div></div></div><div class=\"rv\"><button class=\"rv-btn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"rv9\"><span class=\"lead\"><span>High-Risk AI</span></span><span class=\"meta\"><span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></span></span></button><div class=\"rv-p\" id=\"rv9\"><div class=\"rv-in\"><div class=\"rv-body\"><p>An AI tool or system that, based on its intended purpose, context of use, level of autonomy, or potential impact, could materially affect an individual’s rights, employment, access to opportunities or services, health or safety, legal or financial interests, or create legal, regulatory, security, financial, or reputational risk for Atlas HXM or its clients. This includes tools or systems that make, recommend, materially influence, or substantially automate significant decisions about individuals, as well as any AI system classified as high-risk under applicable law including the EU AI Act.</p></div></div></div></div><div class=\"rv\"><button class=\"rv-btn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"rv10\"><span class=\"lead\"><span>Intellectual Property (IP)</span></span><span class=\"meta\"><span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></span></span></button><div class=\"rv-p\" id=\"rv10\"><div class=\"rv-in\"><div class=\"rv-body\"><p>As defined in Atlas HXM’s Data Classification Policy: creations of the mind, such as inventions, literary and artistic works, designs, symbols, names, and images used in commerce, protected by patents, copyright, trademarks, trade secrets, and confidentiality law.</p></div></div></div></div><div class=\"rv\"><button class=\"rv-btn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"rv11\"><span class=\"lead\"><span>Non-Sensitive Data</span></span><span class=\"meta\"><span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></span></span></button><div class=\"rv-p\" id=\"rv11\"><div class=\"rv-in\"><div class=\"rv-body\"><p>Data that is not classified as Sensitive Data under Atlas HXM’s Data Classification Policy and does not contain confidential, restricted, regulated, or protected information. Examples include publicly available information, generic business information, anonymized examples, dummy names or email addresses, generalized job titles, and fictitious or random identifiers or employee numbers.</p></div></div></div></div><div class=\"rv\"><button class=\"rv-btn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"rv12\"><span class=\"lead\"><span>Personally Identifiable Information (PII) or Personal Data</span></span><span class=\"meta\"><span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></span></span></button><div class=\"rv-p\" id=\"rv12\"><div class=\"rv-in\"><div class=\"rv-body\"><p>Any information capable of identifying a natural person, directly or indirectly, in particular by reference to their name, email address or telephone number, personal address, an identification number, nationality or to one or more factors specific to their employment such as qualifications, skills or employment history, professional or individual identity.</p></div></div></div></div><div class=\"rv\"><button class=\"rv-btn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"rv13\"><span class=\"lead\"><span>Sensitive Data</span></span><span class=\"meta\"><span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></span></span></button><div class=\"rv-p\" id=\"rv13\"><div class=\"rv-in\"><div class=\"rv-body\"><p>As defined in Atlas HXM’s Data Classification Policy: non-public data restricted to a need-to-know basis because of the high risk associated with disclosure, including data that must be kept confidential under law or regulation. Specific examples include government issued or financial information such as social security number (or local equivalent), or personal bank account details, as well as health, racial or ethnic origin, sexual life or orientation, religious or philosophical opinions, political opinions, trade union membership, or genetic or biometric data.</p></div></div></div></div><div class=\"rv\"><button class=\"rv-btn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"rv14\"><span class=\"lead\"><span>Third Party</span></span><span class=\"meta\"><span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></span></span></button><div class=\"rv-p\" id=\"rv14\"><div class=\"rv-in\"><div class=\"rv-body\"><p>Vendors, suppliers, partners, and other entities Atlas HXM relies on for business operations.</p></div></div></div></div></div></div>"}, {"id": "principles", "tag": "Section 3", "title": "AI governance principles", "teaser": "8 principles that govern every use of AI at Atlas HXM.", "short": "Principles", "body": "<p class=\"lede\">Atlas HXM’s use of AI is governed by the following principles:</p><div class=\"grid2\"><div class=\"card \"><p class=\"k\">Principle</p><h3>Lawfulness</h3><p>All AI use at Atlas HXM must comply with applicable law including AI-specific legislation (e.g., the EU AI Act), privacy and data protection law (e.g., GDPR), intellectual property, consumer protection, and competition law, and should reflect recognized good practice, such as the OECD AI Principles and the UNESCO Recommendation on the Ethics of AI.</p></div><div class=\"card \"><p class=\"k\">Principle</p><h3>Human Accountability</h3><p>Employees remain responsible and accountable for all work produced with AI assistance. AI is a tool, not a decision maker or a substitute for human judgment.</p></div><div class=\"card \"><p class=\"k\">Principle</p><h3>Transparency</h3><p>Where material, Atlas HXM will disclose when AI has been used to produce or materially contribute to work product, decisions, or communications.</p></div><div class=\"card \"><p class=\"k\">Principle</p><h3>Fairness and Non-Discrimination</h3><p>AI must not be used in ways that discriminate unlawfully or produce biased outputs that negatively affect individuals based on protected characteristics.</p></div><div class=\"card \"><p class=\"k\">Principle</p><h3>Privacy by Design</h3><p>AI use must build in privacy protection from the outset, minimizing the Personal Data that is entered and processed.</p></div><div class=\"card \"><p class=\"k\">Principle</p><h3>Security</h3><p>AI systems and tools must not introduce security vulnerabilities into Atlas HXM systems, databases, or processes.</p></div><div class=\"card \"><p class=\"k\">Principle</p><h3>Environmental Responsibility</h3><p>Employees should consider the energy and environmental impact of AI use, favoring targeted, efficient prompting over speculative, high-volume queries.</p></div><div class=\"card \"><p class=\"k\">Principle</p><h3>Ethical Use</h3><p>AI must not be used for deceptive, manipulative, or harmful purposes, including generating misinformation, deepfakes, or content that would violate Atlas HXM’s Code of Conduct.</p></div></div>"}, {"id": "acceptable", "tag": "Section 4", "title": "Acceptable use of AI services", "teaser": "What you must and must not do, in 8 parts.", "short": "Acceptable use", "body": "<p class=\"lede\" style=\"margin-bottom:-6px\">Open the part you need.</p><div class=\"rv-set\"><div class=\"rv-top\"><button class=\"link-btn\" type=\"button\" data-all=\"open\">Show all</button></div><div class=\"rv-grid one\"><div class=\"rv\"><button class=\"rv-btn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"rv15\"><span class=\"lead\"><span class=\"n\">1</span><span>Use Approved Tools and Accounts</span></span><span class=\"meta\"><span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></span></span></button><div class=\"rv-p\" id=\"rv15\"><div class=\"rv-in\"><div class=\"rv-body\"><p>Employees must use only: </p><ul class=\"plain\"><li>AI tools, systems and services approved by Atlas HXM;</li><li>Atlas HXM-approved corporate or enterprise AI accounts for work-related AI use; and</li><li>AI features built into Atlas HXM-approved enterprise systems, where those features have been approved for use.</li></ul><p>Employees must not: </p><ul class=\"plain\"><li>Use personal or free-tier AI accounts for Atlas HXM work;</li><li>Use Atlas HXM’s corporate or enterprise AI accounts for personal purposes; or</li><li>Use another account, tool, or method to bypass usage limits, restricted features, access controls, security requirements, or any other restriction Atlas HXM has imposed.</li></ul></div></div></div></div><div class=\"rv\"><button class=\"rv-btn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"rv16\"><span class=\"lead\"><span class=\"n\">2</span><span>Protect Data and Confidential Information</span></span><span class=\"meta\"><span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></span></span></button><div class=\"rv-p\" id=\"rv16\"><div class=\"rv-in\"><div class=\"rv-body\"><p>Employees must protect data and confidential information when using AI. Therefore, Employees: </p><ul class=\"plain\"><li>Must not enter Sensitive Data or other restricted information including Sensitive Personal Data or Sensitive Intellectual Property into an AI tool.</li><li>May enter Non-Sensitive Data into an Approved AI Tool using an Atlas HXM corporate or enterprise account, consistent with the Data Classification Policy and Section 5 of this Policy.</li><li>Must use only the minimum Personal Data necessary for the task, using generic, anonymized, or generalized information wherever possible.</li><li>Must continue to meet Atlas HXM’s confidentiality and intellectual property obligations, including those owed to clients.</li></ul></div></div></div></div><div class=\"rv\"><button class=\"rv-btn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"rv17\"><span class=\"lead\"><span class=\"n\">3</span><span>Review and Validate AI Outputs</span></span><span class=\"meta\"><span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></span></span></button><div class=\"rv-p\" id=\"rv17\"><div class=\"rv-in\"><div class=\"rv-body\"><p>Employees remain responsible for the work they produce with AI assistance. Before using AI-generated content, Employees must review it and confirm it is appropriate for its intended purpose, including checking for:</p><ul class=\"plain\"><li>Accuracy and completeness;</li><li>False or fabricated information (“Hallucinations”);</li><li>Bias, unfairness, or discriminatory content;</li><li>Plagiarism or inappropriate use of third-party content; and</li><li>Suitability for the intended audience and purpose.</li></ul><p>The level of review should match the level of risk. Higher-risk decisions, communications, or outputs require more careful human review and verification. Review methods may include:</p><ul class=\"plain\"><li>Applying professional judgment to assess plausibility;</li><li>Requesting and verifying cited sources;</li><li>Cross-checking outputs using non-AI research methods;</li><li>Using a second AI tool to validate a response for higher-risk outputs; and</li><li>Escalating to a subject-matter expert before relying on AI output in a regulated, legal, financial, or medical context.</li></ul><p>When using High-Risk AI, and in line with the EU AI Act, Employees are responsible for:</p><ul class=\"plain\"><li>Reviewing available technical documentation and transparency instructions; and</li><li>Providing human oversight, including stopping the tool or system’s use where necessary.</li></ul></div></div></div></div><div class=\"rv\"><button class=\"rv-btn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"rv18\"><span class=\"lead\"><span class=\"n\">4</span><span>Human Oversight</span></span><span class=\"meta\"><span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></span></span></button><div class=\"rv-p\" id=\"rv18\"><div class=\"rv-in\"><div class=\"rv-body\"><p>Employees must not use AI to make or implement autonomous decisions about individuals without appropriate human oversight. This includes decisions relating to recruitment or hiring, promotion, performance management, disciplinary action, compensation or other significant employment matters, and termination of employment.</p></div></div></div></div><div class=\"rv\"><button class=\"rv-btn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"rv19\"><span class=\"lead\"><span class=\"n\">5</span><span>Responsible Use</span></span><span class=\"meta\"><span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></span></span></button><div class=\"rv-p\" id=\"rv19\"><div class=\"rv-in\"><div class=\"rv-body\"><p>Employees should use AI in a proportionate and thoughtful way, applying it where it provides a genuine business benefit and avoiding unnecessary use. </p><p>Employees should also consider the environmental impact of AI use, particularly where repeated or resource-intensive use is not necessary for the task.</p></div></div></div></div><div class=\"rv\"><button class=\"rv-btn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"rv20\"><span class=\"lead\"><span class=\"n\">6</span><span>Prompts, Outputs and Legal Disclosure</span></span><span class=\"meta\"><span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></span></span></button><div class=\"rv-p\" id=\"rv20\"><div class=\"rv-in\"><div class=\"rv-body\"><p>Prompts entered into AI tools and the outputs they generate may need to be disclosed in certain circumstances, for example:</p><ul class=\"plain\"><li>Prompts or outputs containing Personal Data may fall within an individual’s data protection rights, including rights exercised through a Data Subject Access Request; and</li><li>Prompts or outputs relating to actual or potential legal proceedings may be subject to disclosure or discovery and should not be assumed to be privileged.</li></ul><p>Employees must therefore use appropriate care when entering information into an AI tool and when retaining AI-generated content.</p></div></div></div></div><div class=\"rv\"><button class=\"rv-btn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"rv21\"><span class=\"lead\"><span class=\"n\">7</span><span>Disclosure of AI Use</span></span><span class=\"meta\"><span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></span></span></button><div class=\"rv-p\" id=\"rv21\"><div class=\"rv-in\"><div class=\"rv-body\"><p>Employees must disclose the use of AI where required by law, regulation, contract, or Atlas HXM policy. Disclosure is also required where AI materially contributes to:</p><ul class=\"plain\"><li>Client-facing deliverables;</li><li>Regulatory submissions, legal filings, or compliance reports;</li><li>Published research, articles, or marketing materials produced on Atlas HXM’s behalf; or</li><li>Formal HR processes or employment decisions where AI tools informed the outcome.</li></ul><p>Suggested disclosure language<em>: “This [document/report/communication] was prepared with the assistance of AI tools and has been reviewed and approved by [Name/Role] for accuracy and compliance.”</em></p></div></div></div></div><div class=\"rv\"><button class=\"rv-btn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"rv22\"><span class=\"lead\"><span class=\"n\">8</span><span>Training and AI Literacy</span></span><span class=\"meta\"><span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></span></span></button><div class=\"rv-p\" id=\"rv22\"><div class=\"rv-in\"><div class=\"rv-body\"><p>Atlas HXM will provide:</p><ul class=\"plain\"><li>Mandatory AI literacy training covering this Policy, data guardrails, approved tools, critical review, and reporting;</li><li>Annual refresher training to keep pace with evolving AI tools, regulatory change, and Atlas HXM’s AI risk landscape; and</li><li>Role-specific training where needed.</li></ul><p>Employees should also take reasonable steps to build their own AI skills, including understanding:</p><ul class=\"plain\"><li>What a tool is designed to do;</li><li>Its limitations;</li><li>How to prompt it clearly;</li><li>Its main risks and benefits; and</li><li>Any Atlas HXM restrictions that apply to its use.</li></ul></div></div></div></div></div></div>"}, {"id": "data", "tag": "Section 5", "title": "Data governance for AI", "teaser": "What to check before you enter information into an Approved AI Tool.", "short": "Data governance", "body": "<ol class=\"steps\"><li class=\"step\"><span class=\"dot\">1</span><h3>Consider</h3><p>Before entering information into an Approved AI Tool, Employees must consider whether it could reveal an Atlas HXM trade secret, breach the Employee’s confidentiality obligations to Atlas HXM, or breach Atlas HXM’s confidentiality obligations to a client or other Third Party.</p></li><li class=\"step\"><span class=\"dot\">2</span><h3>Anonymize or stop</h3><p>If the answer is yes, Employees must follow the Data Classification Policy and either anonymize or redact the information or not use AI for that task.</p></li><li class=\"step\"><span class=\"dot\">3</span><h3>Assess and escalate</h3><p>If neither option is possible and AI use is still considered necessary, the Employee must not proceed until a Privacy Impact Assessment has been completed and the proposed use has been reviewed by Risk &amp; Compliance (<a href=\"mailto:compliance@atlashxm.com\">compliance@atlashxm.com</a>). Appendix A sets out what data may be used and the conditions that apply.</p></li></ol><div><a class=\"btn ghost\" href=\"#appendix-data\">See Appendix A: what data may be used</a></div>"}, {"id": "tools", "tag": "Section 6", "title": "Approved, controlled and banned AI tools", "teaser": "Only tools on the Approved AI Tool list may be used.", "short": "Approved tools", "body": "<div class=\"grid2\"><div class=\"card solid\"><p class=\"k\">The lists</p><p>Atlas HXM maintains and periodically updates lists of Approved AI Tools that Employees may use and banned AI tools that Employees must not use. Employees may use only AI tools on the <a href=\"https://strategichrandcomp.sharepoint.com/:x:/g/isms/IQCbxECCzlFYS4wSJyMLfP0MAcSd2kVaRr89xOCRNaTwPOo?e=ZHI2Pc\" target=\"_blank\" rel=\"noopener\">Approved AI Tool List</a>, and the CISO may block access to any tool identified as banned.</p></div><div class=\"card \"><p class=\"k\">If a use is not covered</p><p>If a use is not addressed in this Policy or on the <a href=\"https://strategichrandcomp.sharepoint.com/:x:/g/isms/IQCbxECCzlFYS4wSJyMLfP0MAcSd2kVaRr89xOCRNaTwPOo?e=ZHI2Pc\" target=\"_blank\" rel=\"noopener\">Approved AI Tool list</a>, Employees must not assume it is permitted and must escalate to Risk &amp; Compliance before proceeding.</p></div></div><div><a class=\"btn\" href=\"https://strategichrandcomp.sharepoint.com/:x:/g/isms/IQCbxECCzlFYS4wSJyMLfP0MAcSd2kVaRr89xOCRNaTwPOo?e=ZHI2Pc\" target=\"_blank\" rel=\"noopener\">Open the Approved AI Tool list</a></div>"}, {"id": "agentic", "tag": "Section 7", "title": "Agentic AI governance", "teaser": "Enterprise-wide requirements and the 10 prohibited uses.", "short": "Agentic AI", "body": "<div class=\"card \"><p>Technical and architectural requirements for designing, building, and deploying Agentic AI systems are addressed separately for Employees within Product &amp; Technology. Examples of permitted Agentic AI business use cases and their conditions are maintained in the “AI at Atlas HXM: Your Quick Guide” document. This Section sets out the enterprise-wide requirements and prohibitions governing Agentic AI, regardless of who deploys it.</p></div><div class=\"card \"><p><strong>Agentic AI</strong> refers to AI systems configured to operate autonomously or semi-autonomously across multi-step workflows. Unlike standard Generative AI tools, where a human submits a prompt and reviews the response, Agentic AI can break a complex task into sub-tasks, invoke tools, APIs, MCP’s, databases, or external services, take actions such as sending emails, writing and executing code, making bookings, or modifying files, and chain multiple AI calls together with limited human interaction between steps.</p></div><div><p class=\"lab\" style=\"margin-bottom:10px\"><strong>Prohibited Use:</strong> The following uses of Agentic AI are prohibited at Atlas HXM:</p><ul class=\"nogos\"><li class=\"nogo\"><span class=\"x\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"/></svg></span><span>Autonomous decision-making or communication relating to hiring, promotion, performance evaluation, disciplinary action, or termination.</span></li><li class=\"nogo\"><span class=\"x\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"/></svg></span><span>Executing financial transactions, approving expenditures, or committing Atlas HXM to contractual or financial obligations above the pre-approved<em> </em>threshold (as defined by Finance) without human involvement.</span></li><li class=\"nogo\"><span class=\"x\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"/></svg></span><span>Unsupervised external communications to clients, regulators, or third parties, except for low-risk automated notifications explicitly authorized by the CLCO. All other external communications require prior human review and approval.</span></li><li class=\"nogo\"><span class=\"x\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"/></svg></span><span>Filing, submitting, or signing legal or regulatory documents on Atlas HXM’s behalf.</span></li><li class=\"nogo\"><span class=\"x\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"/></svg></span><span>Accessing Sensitive Data or Restricted Data without a completed Privacy Impact Assessment and explicit approval from the CISO and CLCO.</span></li><li class=\"nogo\"><span class=\"x\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"/></svg></span><span>Persistent or broad access to production systems, databases, or cloud infrastructure; any access must be narrowly scoped to a specific task and time-limited where possible.</span></li><li class=\"nogo\"><span class=\"x\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"/></svg></span><span>Monitoring, analyzing, or evaluating employees using biometric data, including facial recognition, voice analysis, or physical movement tracking.</span></li><li class=\"nogo\"><span class=\"x\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"/></svg></span><span>Impersonating individuals, generating deepfakes, or otherwise deceiving or manipulating the recipients of AI-generated communications.</span></li><li class=\"nogo\"><span class=\"x\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"/></svg></span><span>Configuring or prompting AI to bypass, disable, or circumvent Atlas HXM’s information security controls, monitoring systems, or access management policies.</span></li><li class=\"nogo\"><span class=\"x\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"/></svg></span><span>Deploying Agentic AI in customer-facing roles without a separate, formal approval process involving the CLCO, CISO, and relevant business leadership.</span></li></ul></div>"}, {"id": "monitor", "tag": "Sections 8 and 9", "title": "Monitoring and third parties", "teaser": "How Atlas HXM monitors AI use and reviews vendors’ use of AI.", "short": "Monitoring", "body": "<div class=\"grid2\"><div class=\"card \"><p class=\"k\">Monitoring</p><p>Atlas HXM may monitor Employees’ use of AI tools. This may include asking Employees to identify the AI tools they use and their purposes and using appropriate IT tools to identify AI services accessed through Atlas HXM systems or devices.</p><p>Atlas HXM will assess the known benefits and risks of AI tools identified as being used by Employees, taking into account their intended or known use within Atlas HXM.</p></div><div class=\"card \"><p class=\"k\">Third parties, AI products and services</p><p>Where a third party will handle Personal Data or Atlas HXM Sensitive Data, Atlas HXM’s third-party risk assessment (TPRA) will review the third party’s use of Generative AI and other AI products and services, and its compliance with applicable AI legislation.</p><p>In line with the EU AI Act, Atlas HXM will consider whether an AI product or service is a High-Risk AI by checking it against the EU High-Risk AI system database.</p></div></div>"}, {"id": "ip", "tag": "Section 10", "title": "Intellectual property and AI outputs", "teaser": "Who owns AI outputs, and how to avoid third-party IP problems.", "short": "IP and outputs", "body": "<div class=\"card \"><p>AI models are trained on large volumes of third-party content, so AI-generated outputs may contain or closely resemble third-party IP. Employees must:</p><ul class=\"checks\"><li>Not assume AI-generated text, images, code, or other outputs are free from third-party IP claims;</li><li>Review AI-generated content for potential copyright or trademark infringement before commercial use or publication;</li><li>Not use AI to reproduce, closely paraphrase, or adapt substantial portions of third-party copyrighted work without legal review; and</li><li>Consult Legal before using AI-generated creative works in client deliverables or published materials.</li></ul></div><div class=\"grid2\"><div class=\"card \"><p class=\"k\">Ownership</p><p>AI-generated outputs produced by Employees in the course of their employment, using Approved AI Tools and incorporating or based on Atlas HXM’s own data, instructions, or materials, will generally be treated as belonging to Atlas HXM, subject to applicable law. Employees must not assert personal ownership over such outputs.</p></div><div class=\"card \"><p class=\"k\">Training data</p><p>Employees must not use Atlas HXM’s proprietary or Sensitive Data in AI tools in a way that could cause that information to be used to train AI models.</p></div></div>"}, {"id": "report", "tag": "Section 11", "title": "Duty to comply and reporting", "teaser": "What you must report, to whom, and how to report anonymously.", "short": "Reporting", "body": "<div class=\"card \"><p class=\"k\">Duty to comply</p><p>Employees are responsible for familiarizing themselves with, and complying with, this Policy. Non-compliance may result in corrective or disciplinary action, up to and including termination of employment, in accordance with Atlas HXM’s Disciplinary Action Policy and applicable local law.</p></div><div class=\"card \"><p class=\"k\">What to report</p><p>Employees must report the following to both Risk &amp; Compliance (<a href=\"mailto:compliance@atlashxm.com\">compliance@atlashxm.com</a>) and the CISO (<a href=\"mailto:help@atlashxm.com\">help@atlashxm.com</a>) as soon as practicable:</p><ul class=\"checks\"><li>Use of AI tools not on the <a href=\"https://strategichrandcomp.sharepoint.com/:x:/g/isms/IQCbxECCzlFYS4wSJyMLfP0MAcSd2kVaRr89xOCRNaTwPOo?e=ZHI2Pc\" target=\"_blank\" rel=\"noopener\">Approved AI Tool list</a> (whether by the Employee, a colleague, or a third party);</li><li>Suspected or confirmed AI-related data breaches or security incidents;</li><li>Discovery that a banned AI tool is in use within Atlas HXM;</li><li>Concerns about AI-generated outputs that may have been relied on in a harmful or incorrect way;</li><li>Any AI use that may constitute a violation of applicable law; and</li><li>Use of personal AI tools for Atlas HXM work or data, or use of an approved enterprise AI tool for personal purposes.</li></ul></div><div class=\"banner\"><strong>Anonymous option</strong><span>Employees can also report non-compliance anonymously via Atlas HXM’s Ethics Line.</span></div>"}, {"id": "owner", "tag": "Sections 12 and 13", "title": "Policy ownership and version history", "teaser": "Who administers the policy and how it has changed.", "short": "Ownership", "body": "<div class=\"card \"><p class=\"k\">Policy ownership</p><p>Risk &amp; Compliance is responsible for administering and educating Employees about it, including any changes, and keeping any necessary records. Risk &amp; Compliance can be contacted with any questions about the Policy.</p></div><div><p class=\"lab\" style=\"margin-bottom:10px\">Version history</p><div class=\"table-wrap \"><table><thead><tr><th>Version Number</th><th>Date</th><th>Changes Made</th><th>Drafter / Reviewer / Approver </th></tr></thead><tbody><tr><td>1.00</td><td>5 June 2025</td><td>Reviewed. Approved.</td><td>CLCO</td></tr><tr><td>1.01</td><td>2 Feb 2026</td><td>Re-drafted</td><td>R&amp;C Manager</td></tr><tr><td>1.02</td><td>—</td><td>Draft updated following initial stakeholder consultation with CTO and CISO</td><td>—</td></tr><tr><td>1.03</td><td>—</td><td>Re-draft following second stakeholder consultation with SVP HR, CTO and CISO</td><td>—</td></tr><tr><td>1.04</td><td>7 Oct 2026</td><td>Final draft prepared for approval</td><td>—</td></tr><tr><td>2.0</td><td>—</td><td>Revised policy approved</td><td>—</td></tr></tbody></table></div></div>"}], "guide": [{"id": "scope", "tag": "Scope", "title": "Scope and what counts as “AI”", "teaser": "Who the guide is for and what it means by AI.", "short": "Scope", "body": "<div class=\"grid2\"><div class=\"card \"><p class=\"k\">Scope</p><p>AI tools like Claude and ChatGPT are part of how we work. When used well, they help us move faster and do better. Used carelessly, they can put confidential data, our clients, and our people at risk. This guide covers what you need to know day-to-day, along with Atlas HXM AI Policy.</p><p>Where this guide does not address a particular matter, the relevant Atlas HXM policies will apply. If local laws or regulations impose stricter requirements, those local laws or regulatory requirements must be followed. </p></div><div class=\"card \"><p class=\"k\">Who this is for</p><p>Who this is for: This guide applies to all Atlas HXM employees, contractors, and consultants across all countries where Atlas HXM operates. It should be read together with the AI Policy, Code of Conduct, Information Security Policy, Data Classification Policy, Data Protection Policy, and Acceptable Use Policy.</p></div></div><div class=\"card solid\"><p class=\"k\">What counts as “AI”</p><p>Any tool that uses machine learning or generative AI to create content, summaries, recommendations, or decisions e.g. standalone tools (ChatGPT, Claude, Copilot) and AI features built into everyday tools (BambooHR, Greenhouse, HubSpot, Zendesk, Teams, and similar).</p></div>"}, {"id": "remember", "tag": "Section 3", "title": "Things to remember", "teaser": "10 everyday habits for using AI at work.", "short": "Things to remember", "body": "<p class=\"lede\" style=\"margin-bottom:-6px\">Tap a habit to read the detail.</p><div class=\"rv-set\"><div class=\"rv-top\"><button class=\"link-btn\" type=\"button\" data-all=\"open\">Show all</button></div><div class=\"rv-grid one\"><div class=\"rv\"><button class=\"rv-btn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"rv23\"><span class=\"lead\"><span class=\"n\">1</span><span>You’re accountable</span></span><span class=\"meta\"><span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></span></span></button><div class=\"rv-p\" id=\"rv23\"><div class=\"rv-in\"><div class=\"rv-body\"><p>You’re accountable. AI may help you draft, but ultimately, you decide. Always review and verify before you send, publish, or act on anything AI produces.</p></div></div></div></div><div class=\"rv\"><button class=\"rv-btn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"rv24\"><span class=\"lead\"><span class=\"n\">2</span><span>Approved tools only</span></span><span class=\"meta\"><span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></span></span></button><div class=\"rv-p\" id=\"rv24\"><div class=\"rv-in\"><div class=\"rv-body\"><p>Use <a href=\"https://strategichrandcomp.sharepoint.com/:x:/g/isms/IQCbxECCzlFYS4wSJyMLfP0MAcSd2kVaRr89xOCRNaTwPOo?e=ZHI2Pc\" target=\"_blank\" rel=\"noopener\">Approved AI Tool list</a> only on your Atlas HXM account. </p></div></div></div></div><div class=\"rv\"><button class=\"rv-btn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"rv25\"><span class=\"lead\"><span class=\"n\">3</span><span>No parallel accounts</span></span><span class=\"meta\"><span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></span></span></button><div class=\"rv-p\" id=\"rv25\"><div class=\"rv-in\"><div class=\"rv-body\"><p>Don’t create a parallel account using your Atlas HXM email in a tool you haven’t been approved for, and don’t pilot a new tool on real Atlas HXM or client data before it’s approved</p></div></div></div></div><div class=\"rv\"><button class=\"rv-btn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"rv26\"><span class=\"lead\"><span class=\"n\">4</span><span>How to get access</span></span><span class=\"meta\"><span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></span></span></button><div class=\"rv-p\" id=\"rv26\"><div class=\"rv-in\"><div class=\"rv-body\"><p>For access to any tool, submit a ticket to IT or email <a href=\"mailto:help@atlashxm.com\" target=\"_blank\" rel=\"noopener\">help@atlashxm.com</a>. As a standard rule, each employee is licensed for one primary AI tool. If you need access to an additional tool for a specific business reason, note that justification in your request. All requests will be reviewed, and access will be determined based on justification and license availability.</p></div></div></div></div><div class=\"rv\"><button class=\"rv-btn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"rv27\"><span class=\"lead\"><span class=\"n\">5</span><span>Keep it separate</span></span><span class=\"meta\"><span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></span></span></button><div class=\"rv-p\" id=\"rv27\"><div class=\"rv-in\"><div class=\"rv-body\"><p>Keep it separate. Don’t use your Atlas HXM AI account for personal tasks and don’t use personal accounts for Atlas HXM work.</p></div></div></div></div><div class=\"rv\"><button class=\"rv-btn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"rv28\"><span class=\"lead\"><span class=\"n\">6</span><span>Mind what you share</span></span><span class=\"meta\"><span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></span></span></button><div class=\"rv-p\" id=\"rv28\"><div class=\"rv-in\"><div class=\"rv-body\"><p>Mind what you share. Sensitive data (employee records, health info, pay, client-confidential info) never goes into an AI tool. See the table below for more information.</p></div></div></div></div><div class=\"rv\"><button class=\"rv-btn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"rv29\"><span class=\"lead\"><span class=\"n\">7</span><span>Be honest about AI’s role</span></span><span class=\"meta\"><span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></span></span></button><div class=\"rv-p\" id=\"rv29\"><div class=\"rv-in\"><div class=\"rv-body\"><p>Be honest about AI’s role. If AI meaningfully shaped a decision or piece of work, be ready to say so if asked, and if AI substantially produced a decision, memo, or communication, note that in the file record at the time. It protects you and Atlas HXM if the decision is ever questioned later.</p></div></div></div></div><div class=\"rv\"><button class=\"rv-btn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"rv30\"><span class=\"lead\"><span class=\"n\">8</span><span>Report incidents</span></span><span class=\"meta\"><span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></span></span></button><div class=\"rv-p\" id=\"rv30\"><div class=\"rv-in\"><div class=\"rv-body\"><p>Report any suspected AI-related security incident or unauthorized AI use to both Risk &amp; Compliance (<a href=\"mailto:compliance@atlashxm.com\">compliance@atlashxm.com</a>) and the CISO (<a href=\"mailto:help@atlashxm.com\">help@atlashxm.com</a>) as soon as practicable.</p></div></div></div></div><div class=\"rv\"><button class=\"rv-btn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"rv31\"><span class=\"lead\"><span class=\"n\">9</span><span>Check who owns the output</span></span><span class=\"meta\"><span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></span></span></button><div class=\"rv-p\" id=\"rv31\"><div class=\"rv-in\"><div class=\"rv-body\"><p>Don’t assume Atlas HXM automatically owns something AI generated. Before substantial AI-generated content goes into an Atlas HXM product, marketing material, or client deliverable, get Legal &amp; Compliance team’s review. </p></div></div></div></div><div class=\"rv\"><button class=\"rv-btn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"rv32\"><span class=\"lead\"><span class=\"n\">10</span><span>Building an app?</span></span><span class=\"meta\"><span class=\"ic\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg></span></span></button><div class=\"rv-p\" id=\"rv32\"><div class=\"rv-in\"><div class=\"rv-body\"><p>If you build an app and want to share it or there is an expense involved, you must email <a href=\"mailto:help@atlashxm.com\">help@atlashxm.com</a> for risk and security review and approval. </p></div></div></div></div></div></div>"}, {"id": "data", "tag": "Section 4", "title": "What can I put in an AI tool?", "teaser": "Three types of data and what each allows.", "short": "What can I put in", "body": "<p class=\"lede\" style=\"margin-bottom:-6px\">When in doubt, share less, not more:</p><div class=\"grid3\"><div class=\"card tier tg\"><div><span class=\"chip g\"><i></i>Yes</span></div><h3>Public</h3><p class=\"small\">Marketing content, public website copy, published info</p><p class=\"ans\">Yes. No restrictions</p></div><div class=\"card tier ty\"><div><span class=\"chip y\"><i></i>With conditions</span></div><h3>Internal / Confidential</h3><p class=\"small\">Internal memos, process docs, project plans, non-sensitive PII</p><p class=\"ans\">Only in Approved tools with an enterprise account. Redact where you can.</p></div><div class=\"card tier tr\"><div><span class=\"chip r\"><i></i>No</span></div><h3>Sensitive / Restricted</h3><p class=\"small\">Employee records, salary, address, birthdates, health data, discipline, legal advice, trade secrets, client-confidential data</p><p class=\"ans\">No. Never put this into any AI tool</p></div></div><div class=\"banner\"><strong>Remember</strong><span>The restriction follows the data, not the file it’s in. If something is too sensitive to paste directly into an AI tool, it’s still too sensitive inside a document, spreadsheet, or email you upload to one — changing the format doesn’t change the classification.</span></div><div><a class=\"btn ghost\" href=\"#appendix-data\">See Appendix A</a></div>"}, {"id": "lights", "tag": "Section 5", "title": "Green, yellow and red light", "teaser": "A quick check on whether a use of AI is okay.", "short": "Traffic lights", "body": "<p class=\"lede\" style=\"margin-bottom:-6px\">Here is a list of examples on how to proceed. For more examples, see Appendix A.</p><div class=\"lts\" role=\"group\" aria-label=\"Choose a light\"><button type=\"button\" class=\"lt g\" data-light=\"g\" aria-pressed=\"true\"><span class=\"dotc\"></span><span>Green light — go ahead</span></button><button type=\"button\" class=\"lt y\" data-light=\"y\" aria-pressed=\"false\"><span class=\"dotc\"></span><span>Yellow light — ask first/get sign-off</span></button><button type=\"button\" class=\"lt r\" data-light=\"r\" aria-pressed=\"false\"><span class=\"dotc\"></span><span>Red light — never</span></button></div><div class=\"card lcard\"><div class=\"lp\" data-lp=\"g\" ><ul class=\"checks lightlist g\"><li>Drafting announcements, FAQs, or other non-decision communications</li><li>Summarizing public or internal documents you already have access to</li><li>Research, learning, and brainstorming (just verify anything before you rely on it)</li><li>Proofreading, formatting, and improving tone on content you wrote</li><li>Drafting presentations, meeting notes, and status updates.</li></ul></div><div class=\"lp\" data-lp=\"y\" hidden><ul class=\"checks lightlist y\"><li>AI-drafted job descriptions or employee communications (HR review required)</li><li>Connecting AI to a system like SharePoint, HubSpot, or Zendesk (needs approval: send an email to <a href=\"mailto:help@atlashxm.com\" target=\"_blank\" rel=\"noopener\">help@atlashxm.com</a>)</li><li>Uploading financial reports, contracts, or call/meeting transcripts (corporate or enterprise account + human review required)</li><li>Any new AI tool, agent, or integration you want to bring into Atlas HXM must follow the TPRA process.</li></ul></div><div class=\"lp\" data-lp=\"r\" hidden><ul class=\"checks lightlist r\"><li>Entering employee, candidate, or client-confidential data into any non-approved AI tool, including personal accounts</li><li>Using AI to analyze emotion, tone, or facial expressions of candidates or employees</li><li>Letting AI infer protected characteristics (race, disability, age, religion, and similar) from data</li><li>Letting AI be the sole decision-maker on anything affecting someone’s employment, pay, or opportunities</li><li>Creating deepfakes or synthetic media of a real person without consent</li><li>Presenting AI-generated work as your own unaided work when attribution matters.</li></ul></div></div><div><a class=\"btn ghost\" href=\"#appendix-usecases\">See examples by function</a></div>"}, {"id": "prompts", "tag": "Section 6", "title": "Prompting reminders", "teaser": "5 habits for safer, better prompts.", "short": "Prompting", "body": "<div class=\"grid2\"><div class=\"card \"><p class=\"k\">Reminder 1</p><h3>Start with less</h3><p>Start with the least sensitive version of your prompt that could still get you the answer you need.</p></div><div class=\"card \"><p class=\"k\">Reminder 2</p><h3>Use placeholders</h3><p>Replace names and identifiers with placeholders when the AI doesn’t need them (“Employee A,” “Client X”).</p></div><div class=\"card \"><p class=\"k\">Reminder 3</p><h3>Set the audience and ask for sources</h3><p>State your audience and constraints up front and ask the AI to cite sources or flag uncertainty — don’t treat unsourced statements as facts.</p></div><div class=\"card \"><p class=\"k\">Reminder 4</p><h3>Check before you rely on it</h3><p>Before you rely on the output, check factual claims against authoritative sources — AI can hallucinate confidently. Verify any quotes, statistics, or citations actually exist before using them.</p></div><div class=\"card \"><p class=\"k\">Reminder 5</p><h3>Watch for hidden assumptions</h3><p>Watch for hidden assumptions in how the AI framed its answer (e.g., about jurisdiction, seniority, gender), and check the output doesn’t ask you to
